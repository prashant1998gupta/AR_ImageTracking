  aside{position:sticky;top:0;height:100vh;overflow-y:auto;width:290px;flex:0 0 290px;
    background:rgba(9,19,29,.86);border-right:1px solid var(--border);padding:22px 18px}

<script>
const PAGES = [{"id":"arrise-readme-md","title":"Overview","group":"ARRISE Platform","md":"# ARRISE WebAR Platform - Developer Documentation\n\n> **Job:** the entry point for the ARRISE platform - Unity WebGL image-tracking\n> builds plus the PHP campaign backend that runs them.\n> **Update when:** a document is added, renamed, or changes purpose.\n> **Do NOT put here:** actual explanations. This file only routes you to the\n> document that owns the answer.\n\nThis folder documents the code we wrote. The **Imagine WebAR - Image Tracker**\nplugin, OpenCV.js, and the Unity engine keep their own vendor documentation and\nare treated as replaceable packages behind our own boundaries.\n\n## What this platform is, in one paragraph\n\nA printed poster becomes an interactive experience. Unity builds a WebGL page\nthat tracks images through the phone camera; a JavaScript overlay on top of that\npage runs the campaign (registration, scoring, clues, sharing); a PHP + MySQL\nbackend owns the rules, the data, and the live admin controls. The flagship\ncampaign type is the **AR Meme Hunt** - a poster-to-poster scavenger hunt run at\ntrade events. Everything a campaign needs at event time is changeable from a\nphone, with **no rebuild**.\n\n## New here?\n\nRead **[Documentation/Engineering](../Engineering/README.md)** first. It is the\nportable handbook for building WebAR on this stack - the traps that make correct\nlooking code behave wrongly, and why. It teaches the *stack*, not this codebase.\nCome back here afterwards.\n\n## Start here\n\n| Document | What it answers |\n|---|---|\n| [ARCHITECTURE.md](ARCHITECTURE.md) | How a campaign is built and served: the four layers, the Unity build pipeline, the post-build injection, and the hard constraints that break a build when violated. |\n| [HUNT_ENGINE.md](HUNT_ENGINE.md) | **Source of truth for the campaign engine.** Data model, every API action, the three event modes, unlock codes, admin controls, anti-cheat, and the honest limitations. |\n| [OPERATIONS.md](OPERATIONS.md) | The event-day runbook, written for the person running the event from a phone - not for a developer. Includes what we can honestly sell to a brand. |\n| [SCRIPT_CATALOG.md](SCRIPT_CATALOG.md) | Every custom source file, what it does, and which package it is allowed to touch. |\n| [PROJECT_EXPLAINED_HINGLISH.md](PROJECT_EXPLAINED_HINGLISH.md) | The same project explained in easy Roman Hindi - the fastest way in if English docs slow you down. |\n\n## The shape of the system\n\n```mermaid\nflowchart TB\n    Poster[\"Printed poster\"] --> Phone[\"Phone camera\"]\n    Phone --> Build[\"Unity WebGL build\u003cbr/>(image tracking + AR content)\"]\n    Build --> Overlay[\"hunt-overlay.js\u003cbr/>(campaign UI on top)\"]\n    Overlay --> API[\"hunt.php\u003cbr/>(rules, scoring, admin)\"]\n    API --> DB[(\"MySQL\")]\n    Admin[\"hunt/admin.html\u003cbr/>(operator, on a phone)\"] --> API\n    Board[\"hunt/leaderboard.html\u003cbr/>(booth screen)\"] --> API\n    Landing[\"hunt/index.html\u003cbr/>(register / resume)\"] --> API\n```\n\nRead that top to bottom once. Almost every question is \"which of those five\nboxes owns this?\", and the answer decides whether a change needs a Unity rebuild\nor just a file upload.\n\n## The one rule that saves the most time\n\n**The server owns the campaign; the build owns the AR.**\n\nPoster labels, hints, clues, scoring mode, unlock codes, branding, ads, which\ntargets are live, whether registration is open - all of it lives in the database\nand changes instantly from the admin panel. The Unity build only knows how to\n*recognise images and play content*.\n\nSo before you rebuild anything, ask: is this actually an AR change? If it is\ntext, rules, scoring, or availability, it is a settings change and you are about\nto waste an hour.\n\n## Deploying a change\n\n| You changed | You must |\n|---|---|\n| `ar-analytics/**` (PHP, admin, landing, leaderboard) | Upload the file. Nothing else. |\n| `hunt-overlay.js` | Replace that one file in the build folder **and** bump `?v=N` in the build's `index.html`. No Unity rebuild. |\n| A Unity scene, target image, or AR content | Rebuild in Unity, then upload the build. |\n| A CDN video or image | Push it to GitHub. jsDelivr `@main` can serve the old file for up to 12h - see [ARCHITECTURE.md](ARCHITECTURE.md). |\n\n## Keeping this documentation current\n\nThere is **no generator**. These files are hand written, which means they rot\nunless you maintain them. That is the trade: no tooling to install, no build step,\nbut you own the upkeep.\n\n- Added or removed a source file -> update [SCRIPT_CATALOG.md](SCRIPT_CATALOG.md).\n- Changed an API action, a settings key, or a scoring rule -> update\n  [HUNT_ENGINE.md](HUNT_ENGINE.md). It is the source of truth; if the code and\n  that document disagree, the document is a bug.\n- Learned something the hard way in production -> write the rule into\n  [Engineering/WEBAR-TRAPS.md](../Engineering/WEBAR-TRAPS.md) **with its\n  mechanism**, while you still remember why it happened.\n- Changed an operator-facing control -> update [OPERATIONS.md](OPERATIONS.md),\n  because the person using it will not read the code.\n"},{"id":"arrise-architecture-md","title":"Architecture","group":"ARRISE Platform","md":"# ARRISE Platform Architecture\n\n> **Job:** how an ARRISE campaign is built and served — the four layers, the build\n> pipeline that wires them together, and the constraints that break a build when\n> broken.\n> **Update when:** a build hook, a scene builder, the WebGL template contract, or\n> one of the hard constraints changes.\n> **Do NOT put here:** the AR Meme Hunt game rules, its HUD, its scoring or its\n> server contract — those belong to `HUNT-ENGINE.md`. Portable Unity rules belong\n> in [../Engineering](../Engineering/).\n\n---\n\n## Purpose\n\nARRISE is a WebAR campaign platform. A campaign is a **Unity 6000.3.9f1 WebGL\nbuild**, served as a plain static folder on shared hosting, that opens the phone\ncamera, recognises a printed image, and plays content on top of it. Nothing is\ninstalled and nothing is an app.\n\nThe stack is deliberately split so that most changes do **not** cost a Unity\nrebuild. Unity owns what is baked (image targets, ids, meshes); the WebGL template\nand its JavaScript own the page; the PHP backend owns everything that changes\nduring a live event.\n\nTwo campaign shapes exist today:\n\n| Shape | What it is | `huntEnabled` |\n|---|---|---|\n| Plain AR experience | Visiting card, poster, product demo. The AR content is the whole thing. | `false` |\n| AR Meme Hunt | Timed / untimed / points scavenger hunt across printed posters at a trade event. Registration gate, chips, timer, leaderboard. | `true` |\n\nBoth ship from the same template and the same overlay file. What separates them is\none line in the built `index.html`, and that line is written by a build hook —\nnever by hand.\n\n---\n\n## The four layers\n\n```mermaid\nflowchart LR\n    subgraph Unity[\"1 - Unity scene (baked at build time)\"]\n        Tracker[\"ImageTracker (root GameObject)\"]\n        Roots[\"Target roots + Content children\"]\n        Campaign[\"CampaignSettings\"]\n    end\n    subgraph Template[\"2 - WebGL template (static files)\"]\n        Index[\"index.html\"]\n        Engine[\"opencv.js / itracker.js / arcamera.js\"]\n    end\n    subgraph Overlay[\"3 - Overlay JS (replaceable without a rebuild)\"]\n        Hunt[\"hunt-overlay.js\"]\n        Analytics[\"ar-analytics.js\"]\n    end\n    subgraph Server[\"4 - PHP + MySQL (dashboard.rionick.com)\"]\n        HuntApi[\"api/controllers/hunt.php\"]\n        TrackApi[\"api/controllers/track.php\"]\n        Admin[\"hunt/admin.html\"]\n    end\n\n    Engine -->|\"SendMessage OnTrack / OnTrackingFound / OnTrackingLost\"| Tracker\n    Tracker --> Roots\n    Tracker -->|\"Analytics.jslib\"| Analytics\n    Analytics -.->|\"wrapped by\"| Hunt\n    Hunt -->|\"fetch ?action=scan\"| HuntApi\n    Analytics -->|\"POST events\"| TrackApi\n    Admin -->|\"live settings\"| HuntApi\n    Campaign -->|\"read at BUILD time\"| Index\n```\n\nWho owns what:\n\n| Layer | Lives in | Owns | Changing it costs |\n|---|---|---|---|\n| Unity scene | `Assets/Scenes_1/*.unity` | Target ids, meshes, physical sizes, video URLs, campaign declaration | A Unity rebuild |\n| WebGL template | `Assets/WebGLTemplates/iTracker`, `iTracker6` | The page, the camera, the tracking engine, the iOS sound unlock, the crash watchdog | A rebuild, **or** editing the uploaded `index.html` |\n| Overlay JS | `hunt-overlay.js` in both templates | All hunt UI and all hunt networking | Upload one file + bump `?v=N` |\n| PHP API | `ar-analytics/` | Participants, scans, scoring, poster list, labels, hints, ads, open/close | Upload the PHP, or edit live in the admin panel |\n\nTwo rules follow from the table, and both have been broken before:\n\n- **Do not put hunt UI in the Unity scene.** The overlay hooks\n  `window.arAnalytics.arImageFound` (which `Analytics.jslib` already calls from\n  `ImageTracker.OnTrackingFound`), so no C# change is needed for any hunt UI work —\n  and anything in the scene needs a rebuild and an upload to fix mid-event.\n- **Do not hard-code the poster list on the server.** Unity owns the ids because\n  they are baked into the build and cannot change after it ships. The server\n  *learns* them from the exported `hunt-posters.json`.\n\n---\n\n## The build pipeline\n\n### Scene builders\n\nA campaign scene is **generated**, not hand-assembled. Each builder clones a\ntemplate scene, strips its demo content, and constructs every tracked target by\nthe same rules, so target #6 is exactly as trustworthy as target #1. All of them\nare idempotent: re-running deletes and re-creates the scene.\n\n| Tool | File | Builds | Notes |\n|---|---|---|---|\n| `Tools ▸ Meme Hunt ▸ 1. Build MemeHunt Scene` | `Assets/Editor/MemeHuntSceneBuilder.cs` | `Assets/Scenes_1/MemeHunt.unity` | Posters are **discovered** from `Assets/AR_Assets/AR Meme Hunt` by their leading number. Drop a file in, rebuild. Adds `CampaignSettings` with `huntEnabled = true` and exports `hunt-posters.json`. |\n| `Tools ▸ Rishabh ▸ Build Rishabh Scene` | `Assets/Editor/RishabhSceneBuilder.cs` | `Assets/Scenes_1/Rishabh.unity` | Visiting card. Two targets (front and back), each with a full duplicate of the content and a world-space UI Canvas. `huntEnabled = false`. |\n| `Tools ▸ AR Card Setup Wizard` | `Assets/Editor/ARCardSetupWindow.cs` | A new card scene, interactively | Older wizard. Does **not** add `CampaignSettings`, does **not** build a `Content` child, and leaves the target root **active** — see the constraints below. |\n| `Tools ▸ AR Setup Automation` | `Assets/Editor/ARAutomationWindow.cs` | A new video scene, interactively | Older wizard, same caveats. Green-screen mode uses a parent/child mesh pair. |\n| `Tools ▸ Rishabh ▸ Sync UI To All Targets` / `Read Layout From Scene` | `Assets/Editor/RishabhLayoutTools.cs` | — | Copies the hand-arranged card UI onto the other target, then writes the arrangement back into `RishabhSceneBuilder.cs` between its `LAYOUT AUTO-BEGIN/END` markers so the next rebuild does not wipe it. |\n| `Tools ▸ Custom Plane Generator` | `Assets/Editor/CustomPlaneGenerator.cs` | A quad mesh asset | Standalone helper. |\n\nNew work goes into a builder in the `MemeHuntSceneBuilder` / `RishabhSceneBuilder`\nshape. The two wizards are kept for existing scenes.\n\n### What happens when you press Build\n\n```mermaid\nflowchart LR\n    Btn[\"Build pressed\"] --> Pre[\"PreBuildCheck\u003cbr/>order -100 + build-button handler\"]\n    Pre --> Dialog[\"PreBuildDialog\u003cbr/>modal, errors block\"]\n    Dialog --> Scene[\"PostProcessScene(-100) PreBuildCheck\u003cbr/>PostProcessScene(0) HuntFlag + AnalyticsKey\"]\n    Scene --> Imagine[\"PostProcessBuild (default order)\u003cbr/>Imagine.WebAR.Editor.PostProcessBuild\"]\n    Imagine --> Flag[\"PostProcessBuild(100)\u003cbr/>HuntFlagPostBuild\"]\n    Flag --> Key[\"PostProcessBuild(101)\u003cbr/>AnalyticsKeyPostBuild\"]\n    Key --> Out[\"built index.html\"]\n```\n\nWhat each hook writes into the built `index.html`:\n\n| Hook | Reads | Writes |\n|---|---|---|\n| `Imagine.WebAR.Editor.PostProcessBuild` | `ImageTrackerGlobalSettings.imageTargetInfos` | Copies every target image into `\u003cbuild>/targets/` **by file name**, then injects one `\u003cimagetarget id='…' src='targets/…'>` tag per target at the `\u003c!--IMAGETARGETS-->` marker |\n| `HuntFlagPostBuild` | `CampaignSettings.huntEnabled` | Rewrites `window.HUNT_CONFIG = { enabled: true\\|false };` |\n| `AnalyticsKeyPostBuild` | `CampaignSettings.analyticsApiKey` | Rewrites `data-project=\"…\"` on the `ar-analytics.js` tag — **or removes the whole tag** when the key is empty |\n\nThe Imagine hook uses the attribute's default callback order, so it runs before\n100 and 101: the other two patch an `index.html` that already has its target tags.\n\n`PreBuildCheck` (`Assets/Editor/PreBuildCheck.cs`) is the gate in front of all of\nit, and it runs twice on purpose: as a modal window at the Build button\n(`BuildPlayerWindow.RegisterBuildPlayerHandler` plus `IPreprocessBuildWithReport`,\ncovering both doors into a build), and as `[PostProcessScene(-100)]`, which sees the\nreal boot scene and throws `BuildFailedException` even if the window was skipped.\nEvery rule in it comes from something that already shipped broken and silently — a\ncompressed build with no decompression fallback that hangs at \"Loading…\", a\n`VideoClip` baked into the build, a target missing from the global registry, a\nmis-pasted analytics key.\n\n### CampaignSettings — the per-scene declaration\n\n```csharp\n// Assets/Scripts/CampaignSettings.cs\npublic bool   huntEnabled     = false;  // hunt overlay ON/OFF for this build\npublic string campaignName    = \"\";     // humans only, unused by the build\npublic string analyticsApiKey = \"\";     // 64 hex chars, or empty = no analytics\n```\n\nOne component, on one object, anywhere in the scene. There is **no central list of\nscene names** anywhere in the project: the scene answers \"what kind of campaign am\nI?\" itself, so adding a campaign, renaming a scene or moving a folder changes\nnothing in the build hooks.\n\nA scene with no `CampaignSettings` behaves as `huntEnabled = false`. That is the\nsafe default in the direction that matters: a client's visiting-card build can\nnever accidentally show somebody else's game HUD. Both scene builders write the\nkey into `CampaignSettings` from a constant in the builder, because rebuilding\ndeletes and re-creates the scene — a key typed only into the Inspector is lost on\nthe next rebuild.\n\n### BootSceneCampaign — the disk fallback, and why it exists\n\n`[PostProcessScene]` is the only place a scene's own components can be inspected,\nbecause it runs with the scene loaded. **It is not guaranteed to run.** Unity skips\nscene processing when an incremental build reuses cached scene data.\n\nWhen it is skipped, the statics that `HuntFlagPostBuild` and `AnalyticsKeyPostBuild`\nfill stay null, and the post-build step falls back to its \"nothing was declared\"\ndefault — which wrote\n\n```html\n\u003cscript>window.HUNT_CONFIG = { enabled: false };\u003c/script>\n```\n\ninto a Meme Hunt build. The result ships with no registration gate, no chips, no\ntimer and no scoring, and looks like a perfectly healthy AR build. Worse, it does\nnot self-correct: once the scene stops being reprocessed, **every** later build is\nwrong the same way. That happened for six consecutive builds during a live event\n(`Editor.log` shows `scene: \u003cunknown>` on each).\n\n`Assets/Editor/BootSceneCampaign.cs` removes the dependency on the callback. Unity\nbuilds the player from the scene **files**, so it reads the file: take the first\n**enabled** entry in Build Settings (the scene the build boots), split the `.unity`\ntext on `^--- ` (YAML document separators), keep documents matching the\n`CampaignSettings` script GUID — falling back to the `::CampaignSettings` identifier\nUnity also writes, so a re-imported script with a new GUID still resolves — and\nregex out `huntEnabled`, `analyticsApiKey`, `campaignName`.\n\nA file read cannot silently not happen. It does require text-serialized scenes\n(`Project Settings ▸ Editor ▸ Asset Serialization ▸ Force Text`); if that is ever\nturned off, `Found` comes back false and both callers log loudly instead of guessing.\n\nThe build console is the record: read the `[HuntFlag]` and `[Analytics]` lines after\nevery build. Both name the scene and where the answer came from.\n`read from: scene file on disk — PostProcessScene did not run this build` is normal\nand correct. A `[HuntFlag]` **error** saying no `CampaignSettings` could be read is\nnot — it means the flag defaulted to OFF.\n\n---\n\n## The AR runtime\n\n### How a tracked target is structured\n\n```text\nImageTracker                 root GameObject, named exactly \"ImageTracker\"\n└── Target1                  target root — INACTIVE in the saved scene\n    │                        MeshFilter + MeshRenderer (the tracking quad)\n    └── Content              ARContentScale — everything visible hangs off HERE\n        ├── Target1 vid      MeshFilter + MeshRenderer + VideoPlayer\n        │                    + CDNARVideoController\n        └── World Canvas     world-space UI (visiting cards only)\n```\n\nThe tracker normalises a target's **width** to 1.0 world unit, so a target is\n`1.00 × (imageHeight / imageWidth)`. Physical size therefore lives in the *mesh*,\ngenerated per target, and the transforms stay identity.\n\nZ convention: quad normals are `Vector3.back` and the camera looks down `+Z`, so\n**more negative Z is closer to the camera**. The tracking quad sits at `z = 0.000`\nand the video plane at `z = -0.010`.\n\n`ImageTracker` must stay a root GameObject with that exact name: `itracker.js`\ndelivers tracking through `unityInstance.SendMessage(\u003cname>, 'OnTrack' | …)`, and\nthe page's crash watchdog restarts tracking with\n`SendMessage('ImageTracker', 'StopTracker')`. `ImageTracker.Start()` logs an error\nif it has a parent; `PreBuildCheck` blocks the build.\n\n### CDNARVideoController — streaming from jsDelivr\n\n`Assets/Scripts/CDNARVideoController.cs`. Videos are **never** baked into the build\n(`PreBuildCheck` treats an assigned `VideoClip` as a blocking error — every visitor\nwould download it before the experience starts). They stream from a public GitHub\nrepo through jsDelivr, e.g.\n`https://cdn.jsdelivr.net/gh/prashant1998gupta/AR_ImageTracking@main/videos/ARMemeHuntVideos/Target-1.mp4`.\nSpaces in a file name must be `%20` — a raw space 404s on jsDelivr. `http://` is a\nblocking error: the page is https, so the browser blocks the video as mixed content.\n\nThe controller does three non-obvious things:\n\n- **The persistent player.** `Awake()` creates a separate `PersistentVP_\u003cname>`\n  GameObject, marks it `DontDestroyOnLoad`, moves a clone of the `VideoPlayer` onto\n  it, disables the original, and calls `Prepare()` immediately. The tracker\n  deactivates the target root on tracking-lost, which would tear down a normal\n  player's WebGL buffer; keeping the player on a live object means a re-track\n  resumes instantly with no re-buffering. `OnEnable` plays, `OnDisable` pauses.\n- **White-flash suppression.** The video renderer starts disabled and is only\n  enabled once `IsVideoTextureReady()` confirms the decoded texture is on the\n  material (larger than the placeholder). Without it a chroma-key shader sees white\n  and clips nothing. `fastLoadMode = true` skips the hold when the extra frame\n  matters more than the flash.\n- **The iOS sound unlock.** See the fourth constraint below.\n\n`cdnVideoUrl` wins over the in-scene `VideoPlayer.url`. `Awake()` clones\n`url → source → clip` in that order, so the builders set `source` explicitly.\n\n### ARContentScale — `?scale=` without a rebuild\n\n`Assets/Scripts/ARContentScale.cs` sits on the `Content` object. In `Start()` it\nreads `Application.absoluteURL` (which carries the full query string in a WebGL\nbuild, so no JS plugin is needed), looks for `scale` or `ar_scale`, clamps to\n`[minScale, maxScale]` (0.05 – 5), and writes `transform.localScale`. So\n`https://your-host/rishabh/?scale=0.58` retunes the content live.\n\nGetting \"the AR matches the printed card\" right is a judgement call that can only be\nmade on a phone, against the real card, in real light. Before this component every\nguess cost a rebuild **and** an upload, so the number got guessed instead of\nmeasured. Now: try values on the phone in seconds, then bake the winner into the\nbuilder's `ContentScale` and rebuild once. With no `?scale=` in the URL the\nserialized value is used, so a shipped build behaves exactly as authored.\n\n---\n\n## Hard constraints\n\nEach of these is a real, verified failure mode in this repo. All four are silent:\nthe build succeeds and the page loads.\n\n### Put every authored size, position and rotation on a child, never on the target root.\n`breaks things` · `junior trap`\n\n**Why** — `ImageTracker.ParseData()` runs for the tracked id on **every tracked\nframe** and hard-assigns the root's transform:\n\n```csharp\n// Assets/Imagine/ImageTracker/Scripts/ImageTracker.cs\nif (trackerCam.isFlipped) { ... target.localScale = flippedScale; }   // (-1, 1, 1)\nelse                      {     target.localScale = Vector3.one;  }\n...\ntarget.position = newPos;\ntarget.rotation = newRot;\n```\n\nAnything authored on the root survives exactly until the first tracked frame, then\nsnaps away. In the Editor everything looks correct, because `ParseData` never runs.\n\n```csharp\n// ✗ wiped on the first tracked frame\ntargetRoot.transform.localScale = Vector3.one * 0.625f;\n\n// ✓ the tracker owns the root; a child owns the size\ntargetRoot.transform.localScale = Vector3.one;          // identity, always\ncontentObj.transform.SetParent(targetRoot.transform, false);\ncontentObj.transform.localScale = Vector3.one * 0.625f; // ARContentScale lives here\n```\n\nPhysical size that must not be scalable at all belongs in the **mesh** — that is\nwhy both builders generate a per-target quad mesh instead of scaling a shared one.\n\n**Spot it:** any non-identity `localScale`, `localPosition` or `localRotation` on a\nTransform listed in `ImageTracker.imageTargets`.\n\n### Every target root must carry a Renderer.\n`breaks things`\n\n**Why** — `ImageTracker.Start()` dereferences it with no null check:\n\n```csharp\nforeach (var i in imageTargets)\n{\n    targets.Add(i.id, i);\n    i.transform.GetComponent\u003cRenderer>().enabled = false;   // ← no null check\n    i.transform.gameObject.SetActive(false);\n    serializedIds += i.id;\n    ...\n}\n```\n\nThe damage is not limited to that one target. The `NullReferenceException` escapes\nthe loop, so no later target is added to `targets`, `serializedIds` is left\ntruncated, and `StartWebGLiTracker(serializedIds, name)` below is never reached:\n**nothing tracks at all**. In the browser this reads as \"the camera opens and\nnothing ever happens\".\n\n```csharp\n// ✓ mandatory, even though this material is never seen\ntargetObj.AddComponent\u003cMeshFilter>().sharedMesh = GetOrCreateMesh(w, h, id + \"_TrackImg\");\ntargetObj.AddComponent\u003cMeshRenderer>().sharedMaterial = trackingImageMaterial;\n```\n\nThe renderer is disabled on the very next statement, so the material exists only to\nmake the target visible while authoring in the Editor.\n\n**Spot it:** a target root with no `MeshRenderer` in the Inspector.\n\n### Target roots must be saved INACTIVE.\n`breaks things` · `junior trap`\n\n**Why** — `ImageTracker` deactivates the roots in `Start()`, and Unity runs **every**\n`Awake` and `OnEnable` in the scene before **any** `Start`. So for an active root the\norder is:\n\n1. `CDNARVideoController.Awake()` — builds the persistent player and calls\n   `Prepare()`, which begins the CDN download.\n2. `CDNARVideoController.OnEnable()` — calls\n   `PlayVideoWithWebGLAutoplayFallback()` → `videoPlayer.Play()`.\n3. *only then* `ImageTracker.Start()` → `SetActive(false)` → `OnDisable()` → pause.\n\nEvery target's video therefore starts downloading and playing at page load, before\nanything has been scanned — and `Start()` ordering between different objects is\nundefined, so how much of that is audible is not deterministic. On a five-poster\nhunt that is five concurrent video streams competing for venue Wi-Fi.\n\n```csharp\n// ✓ last line of every target builder\ntargetObj.SetActive(false);\n```\n\nThe same trap has a second door: a GameObject parented under `ImageTracker` but\n**not** listed in `imageTargets` is never deactivated by anything, because the loop\nabove only walks the list. `MemeHuntSceneBuilder` destroys such strays with a\nwarning for exactly this reason.\n\n**Spot it:** any child of `ImageTracker` ticked active in the Hierarchy.\n`ARCardSetupWindow` and `ARAutomationWindow` do not call `SetActive(false)` — scenes\nfrom those wizards need it applied by hand.\n\n### `webGLSoundTargetKey` must equal the tracker id.\n`breaks things` · `junior trap`\n\n**Why** — on iOS Safari (`IsAppleMobileBrowser()` in `index.html`) autoplay with\nsound is refused, so the page runs a per-target unlock handshake:\n\n```mermaid\nflowchart LR\n    Play[\"CDNARVideoController.PlayVideoWithWebGLAutoplayFallback\"]\n      --> Set[\"SetWebGLCurrentTargetKey(webGLSoundTargetKey)\u003cbr/>→ window.__AR_CURRENT_TARGET_KEY\"]\n    Set --> Req[\"RequiresWebGLSoundUnlock()\u003cbr/>__AR_TARGET_SOUND_UNLOCKS[key] ?\"]\n    Req -->|\"not unlocked\"| Mute[\"play muted + show 'tap for sound'\"]\n    Mute --> Tap[\"OnUserTapEnableSound()\u003cbr/>__AR_TARGET_SOUND_UNLOCKS[key] = true\"]\n    Req -->|\"unlocked\"| Sound[\"play with sound\"]\n```\n\nThat key is the **only** thing linking \"the visitor already tapped\" to \"this video\nmay have sound\". Two ways it goes wrong:\n\n- **Left empty.** `Awake()` falls back to `ResolveWebGLSoundTargetKey()`, which\n  returns `transform.parent.name`. Under the builders' hierarchy the parent is\n  literally `Content` for *every* target, so all targets collapse onto one shared\n  key and the per-target unlock stops being per-target.\n- **Set to something other than the tracker id.** `ImageTracker.OnTrackingFound`\n  calls `SetActive(true)` — which runs `OnEnable`, and therefore the whole play\n  path above — and only *afterwards* broadcasts\n  `OnWebGLTargetTrackingStateChanged(id)`, which is what overwrites\n  `webGLSoundTargetKey` with the real id. So the **first** acquisition of a target\n  files the visitor's unlock under the authored key, and the next acquisition asks\n  for the tap again under the tracker id.\n\n```csharp\n// ✗ derived at runtime → \"Content\" for every target\n// (leave the field empty)\n\n// ✓ MemeHuntSceneBuilder.cs / RishabhSceneBuilder.cs / ARCardSetupWindow.cs\ncdn.webGLSoundTargetKey = p.id;    // exactly the ImageTracker id\n```\n\nNothing catches a wrong key automatically. `PreBuildCheck`'s sound-key warning only\nfires when the controller's **parent** is itself a scene target id, and the\n`Content` container in between means it never is. This has to be correct by\nconstruction in the builder.\n\n**Spot it:** any `CDNARVideoController` whose `webGLSoundTargetKey` is empty or is\nnot exactly one of `ImageTracker.imageTargets[].id`.\n\n---\n\n## Adding a new campaign, end to end\n\n1. **Prepare the target images.** Roughly 1000–1600 px on the long edge — tracking\n   uses features, not pixels, and every registered image is downloaded and\n   feature-extracted before the camera opens. Ids must match\n   `^[A-Za-z0-9_-]{1,64}$` (no spaces). **Image file names must be unique across\n   every registered target**: `PostProcessBuild` copies them into\n   `\u003cbuild>/targets/` by file name, and a collision silently overwrites one.\n2. **Put the video on the CDN.** Commit it under `videos/` and push; jsDelivr\n   publishes it at `…/gh/\u003cuser>/\u003crepo>@main/videos/\u003cfile>`. `https://` only; encode\n   spaces as `%20`.\n3. **Generate the scene** with the right builder (table above). For a hunt, drop the\n   posters into `Assets/AR_Assets/AR Meme Hunt` named with their hunt order and run\n   `Tools ▸ Meme Hunt ▸ 1.`; for a card, configure `RishabhSceneBuilder`'s CONFIG\n   block or use the wizard.\n4. **Check the campaign declaration.** One `CampaignSettings` in the scene;\n   `huntEnabled` correct; `analyticsApiKey` either empty (ships with no analytics —\n   the tracker tag is removed) or exactly the 64 hex characters from\n   `Admin ▸ Projects ▸ API Key`. Put the key in the builder's constant too, or the\n   next rebuild loses it.\n5. **Hunts only: hand the ids to the server.** `Tools ▸ Meme Hunt ▸ 3. Copy Poster\n   List JSON` writes `\u003cprojectRoot>/hunt-posters.json`; paste it into\n   `hunt/admin.html ▸ Settings ▸ Poster list`. Skip this and the server scores\n   against its own built-in ids — the camera tracks the poster and the video plays,\n   but the scan is rejected with `400` and the chip never ticks. The overlay logs\n   `[Hunt] POSTER ID MISMATCH` in the browser console when it detects this.\n6. **Player Settings.** WebGL platform; `WebGL Template = iTracker` (or `iTracker6`).\n   Any other template has no `arcamera.js` / `itracker.js` and nothing tracks.\n7. **Build Settings.** Exactly one enabled scene, and it must be this campaign —\n   both build hooks read only the **first** enabled scene.\n8. **Run `Tools ▸ ARRISE ▸ Pre-Build Check`** and clear the errors. Most have a\n   one-click fix in the dialog.\n9. **Build.** Read the `[HuntFlag]` and `[Analytics]` console lines before doing\n   anything else.\n10. **Verify the built `index.html`** — `window.HUNT_CONFIG`, `data-project`, and one\n    `\u003cimagetarget>` tag per target.\n11. **Upload the build folder** to its own directory on the host.\n12. **Restore the shared global target list** if the pre-flight's \"Trim to this\n    scene\" fix was used — it edits an asset every campaign shares:\n    `git checkout -- Assets/Imagine/ImageTracker/Resources/ImageTrackerGlobalSettings.asset`\n\n---\n\n## Deployment: rebuild versus upload\n\nThe whole layering exists so that the answer to most questions is \"upload a file\".\n\n| I changed… | Unity rebuild? | What to do |\n|---|---|---|\n| Hunt UI, HUD, scan flow, victory card | **No** | Edit `hunt-overlay.js` in **both** templates, bump `?v=N` in both `index.html`, upload `hunt-overlay.js` + `index.html` to the live build folder |\n| Poster labels, hints, mode, anti-cheat floors, sponsor ads, open/close a target | **No** | `hunt/admin.html ▸ Settings` — live, from a phone, mid-event |\n| Hunt API, landing page, leaderboard, admin panel, analytics dashboard | **No** | Upload the changed PHP/HTML under `ar-analytics/` |\n| A campaign video | **No** | Replace the file under `videos/`, commit and push — see the jsDelivr note below |\n| Content scale, while tuning | **No** | `?scale=…` on the URL |\n| Content scale, as the shipped default | **Yes** | Bake it into the builder's `ContentScale`, rebuild |\n| Analytics key or hunt flag | **Yes** (or hand-edit the uploaded `index.html`) | `CampaignSettings`, rebuild |\n| Target images, ids, meshes, scene structure, C# | **Yes** | Re-run the builder, rebuild |\n\n### The `?v=N` cache-buster is not optional\n\n`hunt-overlay.js` is a static file and phones cache it aggressively. Editing it\nwithout bumping `?v=N` means everyone who already opened the build keeps the **old**\noverlay — the change looks like it never shipped. `PreBuildCheck.CheckOverlaySync`\nguards both halves: it warns (with a one-click copy) when `iTracker` and `iTracker6`\nhave drifted apart, and it stores the file's hash in `EditorPrefs` keyed by the\ncurrent `?v=` number, raising a **blocking error** with a one-click bump if the file\nchanged while the number did not. The uploaded build's own `index.html` is a\nseparate copy and must be bumped there too.\n\n### The jsDelivr `@main` cache\n\nThe video URLs pin a **branch**, not a tag or a commit:\n`cdn.jsdelivr.net/gh/prashant1998gupta/AR_ImageTracking@main/videos/…`\n\njsDelivr caches a branch reference for **up to 12 hours**. Overwriting a file at the\nsame path therefore does not swap the video on visitors' phones for up to half a\nday, and no amount of reloading helps. To swap a clip in a hurry, **ship it under a\nnew file name** (and rebuild, or hand-edit the URL), or purge the path through\njsDelivr's purge endpoint. Never plan an event-day content swap around an in-place\noverwrite.\n\n### Hosting notes\n\nBuilds sit on plain shared hosting, which is why `PreBuildCheck` blocks two Player\nSettings: **Decompression Fallback must be on** whenever compression is enabled (the\nhost does not send `Content-Encoding` for `.br` / `.gz`, and the page then hangs at\n\"Loading…\" forever), and **WebGL multithreading must be off** (it needs COOP/COEP\nheaders the host does not send, and without cross-origin isolation the build refuses\nto start). Data Caching should be on — at an event most visitors open the same build\nmore than once.\n\nThe backend lives at `dashboard.rionick.com`; `ar-analytics/.htaccess` routes\n`^api/(.*)` into `api/index.php`, passes `tracker/`, `dashboard/`, `admin/` and\n`hunt/` straight through, and blocks `api/config.php`, `api/helpers/` and `sql/`.\n"},{"id":"arrise-hunt-engine-md","title":"Hunt Engine","group":"ARRISE Platform","md":"# Hunt Engine\n\n> **Job:** the source of truth for the campaign engine - the data model, every\n> API action, the three event modes, the engagement gates, the admin controls,\n> the anti-cheat, and what the engine honestly cannot do.\n> **Update when:** you add or change an API action, a `hunt_settings` key, a\n> ranking rule, or a scan-time invariant. If the code and this file disagree,\n> **this file is the bug**.\n> **Do NOT put here:** how a build is produced or served\n> ([ARCHITECTURE.md](ARCHITECTURE.md)), or how to run an event from a phone\n> ([OPERATIONS.md](OPERATIONS.md)).\n\nThe engine lives in three files:\n\n| File | Lines | Owns |\n|---|---|---|\n| `ar-analytics/api/controllers/hunt.php` | 1766 | Every rule. The database. The only authority. |\n| `Assets/WebGLTemplates/iTracker/hunt-overlay.js` | 1507 | The player's HUD, gates, clue cards, victory card. Trusts the server for all state. |\n| `ar-analytics/hunt/{index,admin,leaderboard}.html` | 916 + 410 + 389 | Register/resume, operator controls, booth screen. |\n\n`hunt-overlay.js` exists in two template folders (`iTracker/` and `iTracker6/`)\nand both are shipped copies of the same file. Change one, change both.\n\n---\n\n## What the engine is\n\nA scavenger hunt across printed posters. A visitor registers on a web page, gets\na token, walks into an AR build, points the camera at a poster, and the build's\nimage-tracking event is intercepted and turned into a scored scan.\n\nThe engine's actual job is narrower than it looks: **it turns image-tracking\nevents into ranked, exportable leads.** Everything else - clues, timers, modes,\ncodes, offers, branding - is configuration on top of that one transform.\n\nTwo properties shape every design decision below. **The server owns every rule**:\nthe client asserts \"I saw poster X\", and the server decides whether that counts,\nwhether the clock starts, whether the player is done, and what rank they hold.\nAnd **nothing needs a rebuild**: labels, clues, scoring mode, unlock codes,\noffers, branding, ads, which targets are live, whether registration is open -\nall of it is rows in `hunt_settings`, changed from a phone, live.\n\n---\n\n## The player journey\n\n```mermaid\nflowchart LR\n    Reg[\"hunt/index.html\u003cbr/>register or resume\"] --> Token[\"token + 5-digit code\"]\n    Token --> AR[\"AR build\u003cbr/>?hunt_token=...\"]\n    AR --> Found[\"arImageFound(id)\"]\n    Found --> Scan[\"POST ?action=scan\"]\n    Scan --> Gate{\"gates\"}\n    Gate -->|\"out of order\"| Reject[\"409 - find X next\"]\n    Gate -->|\"needs a code\"| Code[\"need_code prompt\"]\n    Gate -->|\"ok\"| Count[\"row in hunt_scans\u003cbr/>clock starts on first\"]\n    Count --> Enjoy[\"enjoy card + offer\u003cbr/>meme plays\"]\n    Enjoy --> Clue[\"Next Clue -> hint for\u003cbr/>first unscanned poster\"]\n    Clue --> Found\n    Count --> Done{\"all open\u003cbr/>posters held?\"}\n    Done -->|\"yes\"| Victory[\"completed_at set\u003cbr/>victory card + share\"]\n```\n\nStep by step, with the mechanism that matters at each step:\n\n| Step | What happens |\n|---|---|\n| **Register** | `handleRegister` normalises the phone (strips `+91` / leading `0`), inserts, calls `assignPlayerCode`. The response *is* the participant state, token included. |\n| **Hand off to AR** | The landing page appends `?hunt_token=...` to `HUNT_AR_URL`. Different origin, so localStorage does not carry; the overlay moves the token into storage and scrubs the URL with `history.replaceState`. |\n| **Boot** | `boot()` calls `status`. Until it settles, `bootSettled` is false and found-events buffer in `earlyFound`, then replay - a fast Unity boot on slow Wi-Fi would otherwise drop the first scan. |\n| **Scan** | The overlay wraps `window.arAnalytics.arImageFound`, which `Analytics.jslib` calls from Unity on every acquisition. **No C# change is needed for the hunt to exist.** |\n| **Enjoy phase** | The thumbnail freezes on what was just found (`peekHold`) and the clue stays hidden until \"Next Clue\" appears (`next_btn_delay_s`, default 9s) and is tapped. Memes run 4-8s; revealing the clue instantly trains people to skip the content the brand paid for. |\n| **Complete** | `maybeFinalizeCompletion` sets `completed_at` the moment the participant holds every currently-open poster. |\n| **Victory card** | `buildVictoryCard` draws a 1080x1350 canvas from shapes and text only - no external images, so the canvas is never CORS-tainted and `toBlob` always works - then shares the pre-built `File` via `navigator.share`, falling back to a download. |\n\n### The clock starts at the first scan, not at \"Start\"\n\n`breaks things` if you move it\n\n**Why** - the WebGL build is tens of megabytes and the walk to poster 1 is\nunbounded. Starting the clock on the landing page would rank people by download\nspeed and by how far they stood from the first poster. So `handleStart`\ndeliberately starts nothing - it is a readiness check that returns state and a\n\"the timer starts at your first scan\" message.\n\n`handleScan` starts it instead, and only for an **open** poster, and only after\nthe sequential and unlock-code gates have passed:\n\n```php\nif ($isOpen && $participant['started_at'] === null) {\n    $db->execute(\"UPDATE hunt_participants SET started_at = NOW(3) WHERE id = ? AND started_at IS NULL\", ...);\n}\n```\n\n**Spot it:** any new gate added to `handleScan` **below** that UPDATE. A gate\nplaced after it starts the clock and then refuses the scan.\n\n---\n\n## Data model\n\nFour tables, all auto-created on first request by the migration block at the top\nof `hunt.php` (`SHOW TABLES LIKE ...`). There is no separate schema file.\n\n### `hunt_participants` - one row per person\n\n| Column | Type | Meaning |\n|---|---|---|\n| `id` | INT PK | Internal id. Used everywhere except the client. |\n| `name` | VARCHAR(100) | Public on the leaderboard; first name only on the live feed. |\n| `phone` | VARCHAR(20) | **The unique participant identity.** `UNIQUE uk_phone`. Normalised before insert. Never public. |\n| `company` | VARCHAR(150) | Shown under the name on the leaderboard; exported as a lead. |\n| `business_type` | VARCHAR(100) | Lead qualification only. Admin/export surfaces. |\n| `token` | VARCHAR(64) | 16 random bytes hex. `UNIQUE uk_token`. The bearer secret the overlay holds. |\n| `player_code` | VARCHAR(5) NULL | 5-digit human identifier, 10000-99999. `UNIQUE uk_player_code`. |\n| `consent` | BOOLEAN | Required at registration; refused without it. |\n| `registered_at` | TIMESTAMP | Feeds the \"joined\" events and the \"hunting now\" count. |\n| `started_at` | DATETIME(3) NULL | Set at the **first counted scan**. NULL = clock not running. |\n| `completed_at` | DATETIME(3) NULL | The **last counted scan**, not `NOW()`. `INDEX idx_completed`. |\n| `total_ms` | BIGINT NULL | `completed_at - started_at` in milliseconds. The timed-mode ranking key. |\n| `is_verified` | BOOLEAN | Admin pressed Verify. Re-admits a flagged player to the public board. |\n| `is_suspect` | BOOLEAN | Failed a plausibility floor. Hidden from every public surface until verified. |\n\nMillisecond precision (`DATETIME(3)`, `NOW(3)`) is not decoration: at a busy\nbooth two finishers can share a second, and `total_ms` is the tie-break key.\n\n### `hunt_scans` - one row per person per poster\n\n| Column | Type | Meaning |\n|---|---|---|\n| `id` | BIGINT PK | - |\n| `participant_id` | INT FK | `ON DELETE CASCADE` - removing a participant removes their scans. |\n| `poster_id` | VARCHAR(64) | The **Unity image-target id**, baked into the build. `INDEX idx_poster`. |\n| `scanned_at` | DATETIME(3) | Server time. The client never supplies a timestamp. |\n\n`UNIQUE KEY uk_participant_poster (participant_id, poster_id)` is the whole\nduplicate-suppression mechanism. `handleScan` does not check first - it inserts\nand catches error 1062:\n\n```php\n} catch (PDOException $e) {\n    $isDupKey = $e->getCode() == 23000 || (isset($e->errorInfo[1]) && intval($e->errorInfo[1]) === 1062);\n    if ($isDupKey) { $duplicate = true; }   // poster already counted\n```\n\n**Why the insert-and-catch instead of a SELECT** - two found-events fire in a\nburst from the same tracking acquisition. A check-then-insert has a window\nbetween the two; the unique key does not.\n\n### `hunt_settings` - the entire campaign configuration\n\n`setting_key VARCHAR(64) PRIMARY KEY`, `setting_value TEXT`, `updated_at`.\nValues are JSON (`json_encode`/`json_decode`). **An absent row means \"use the\nbuilt-in default\"** - that is the reset mechanism, and `deleteHuntSetting` is\nhow the admin panel resets things.\n\n| Key | Shape | What it does |\n|---|---|---|\n| `poster_list` | `[{id,label,hint}]` | The Unity-exported manifest. **Replaces** the hardcoded poster list entirely - ids, order, and count. Absent or all-invalid = built-ins. Capped at 60 entries. |\n| `posters` | `{id: {label,hint,unlock_code,points,offer}}` | Per-poster overrides applied **on top of** whichever list won. Empty `label`/`hint` fall back to the default (that is the per-field reset). |\n| `mode` | `\"untimed\"` or `\"points\"` | Event mode. **Never stores `\"timed\"`** - the admin save path deletes the row instead. See \"Event modes\". |\n| `floors` | `{min_total_s, min_gap_s}` | Anti-cheat plausibility floors in seconds. Clamped 0-3600 and 0-600 on save. |\n| `branding` | `{event_name, event_meta, brand_name, hunt_title, powered_by, primary_color, cta_headline, cta_text, cta_url}` | White-label text and colour, applied live across overlay, landing page, leaderboard and victory card. |\n| `ui` | `{next_btn_delay_s, sequential, ads:[{image,link}]}` | Clue-button delay (0-60s), sequential-order toggle, up to 4 https-only sponsor interstitials. |\n| `registration_closed` | `true` | Present = no **new** sign-ups. Existing players are unaffected. |\n| `leaderboard_off` | `true` | Present = the public leaderboard returns `enabled:false` and no names at all. |\n| `feed_off` | `true` | Present = the live activity ticker returns nothing. Independent of the leaderboard. |\n| `leaderboard_over_msg` | string | The message shown in place of the rankings while the board is off. **No admin UI writes this** - it is DB-only today. |\n| `closed_posters` | `[id, ...]` | Targets closed mid-event. Ids not in the live list are ignored on read. |\n\nThe 60-poster cap in `normalizePosterList` is not arbitrary:\n\n```php\n// hunt_settings.setting_value is TEXT (65 535 bytes). A huge list would be\n// truncated mid-JSON by MySQL, json_decode would then fail on the next read\n// and the server would silently fall back to the built-in placeholders.\nif (count($out) >= 60) { break; }\n```\n\n`branding.event_meta` is stored, editable in the admin panel, and **rendered\nnowhere**. Either wire it up or drop the field; leaving it is a trap for the\nnext person who edits it and sees no effect.\n\n### `hunt_resume_throttle` - brute-force budget per IP\n\n| Column | Type | Meaning |\n|---|---|---|\n| `ip` | VARCHAR(45) PK | `REMOTE_ADDR` only - the TCP peer, deliberately not `X-Forwarded-For`. |\n| `fail_count` | INT | Failed resume-by-code attempts in the current window. |\n| `window_start` | TIMESTAMP | Rolled by the `ON DUPLICATE KEY UPDATE` when older than the window. |\n\nBest-effort by design: a missing table or a DB hiccup never blocks a real\nresume - every throttle helper swallows its exception.\n\n---\n\n## The API surface\n\nOne file, one `switch ($action)`. Envelope is always\n`{success, message, data}` from `Response`. Admin auth is a Bearer token from\n`auth.php?action=admin-login`, checked by `Auth::requireAuth(['admin','super_admin'])`.\n\n| Action | Method | Auth | Body / query | Returns |\n|---|---|---|---|---|\n| `register` | POST | none | `{name, phone, company?, business_type?, consent}` | Participant state incl. `token`, `player_code`. 403 if closed and new; 409 if the phone exists under a different name. |\n| `resume` | POST | none | `{name, code}` **or** `{name, phone}` | Participant state. Code path is throttled; phone path is not. |\n| `start` | POST | none | `{token}` | Participant state. Starts nothing - a readiness check. |\n| `scan` | POST | none | `{token, poster_id, code?}` | State + `duplicate`, `counted`, `poster_id`, `offer`, or `need_code`/`code_wrong`/`poster_label`. |\n| `status` | any | none | `?token=` | Participant state. Also runs `maybeFinalizeCompletion`. |\n| `config` | any | none | - | `{posters, total, inactive, ui}`. The pre-registration branding/count fetch. |\n| `leaderboard` | any | none | - | `{enabled, mode, metric_label, leaderboard[], stats}`, or `{enabled:false, over_message, branding}` when hidden. |\n| `activity` | any | none | - | `{enabled, events[], hunting_now}`. First names only, no phones. |\n| `admin-participants` | any | admin | - | `{participants, posters, closed, registration_open, leaderboard_on, feed_on, stats}`. Feeds the whole dashboard. |\n| `admin-export` | any | admin | - | CSV of everyone, incl. phone and per-poster scan times. |\n| `admin-export-stall` | any | admin | `?poster_id=` | CSV of everyone who scanned **one** poster. The per-brand lead list. |\n| `admin-verify` | POST | admin | `{id, verified}` | Sets/clears `is_verified`; clearing re-runs the plausibility check. |\n| `admin-add-player` | POST | admin | `{name, total_ms, phone?, company?}` | Seeds a finished, pre-verified run plus spread scan rows. |\n| `admin-remove` | POST | admin | `{id}` | Deletes one participant (scans cascade). |\n| `admin-reset` | POST | admin | `{confirm:\"RESET\"}` | Wipes all participants and scans. |\n| `admin-settings` | any | admin | - | `{posters, closed, poster_source, poster_list, floors, ui, branding, mode}`. |\n| `admin-save-settings` | POST | admin | `{poster_list?, posters?, mode?, floors?, branding?, ui?}` | Saves any subset. Live immediately. |\n| `admin-set-target-state` | POST | admin | `{id, open}` | `{closed, open_count}`. The event-time kill-switch. |\n| `admin-set-registration` | POST | admin | `{open}` | `{registration_open}`. |\n| `admin-set-display` | POST | admin | `{what:\"leaderboard\"\\|\"feed\", open}` | `{what, open}`. |\n| anything else | any | - | - | 404 `Unknown action`. |\n\nNote the \"any\" method rows: only the POST actions carry\n`if ($method !== 'POST') Response::error('Method not allowed', 405)`. The read\nactions accept any verb. Harmless today, but do not read the table as a\nguarantee.\n\n`participantState()` is the single response shape almost everything returns:\n`token, name, player_code, started, completed, scanned[], count, total, score,\ninactive[], next{id,label,hint}, total_ms, elapsed_ms, time_formatted, rank,\nposters[], ui{}`. Because the whole state ships on every scan, the overlay never\nhas to reconcile - it just re-applies.\n\n`elapsed_ms` is computed by **MySQL**, not PHP:\n\n```php\n\"SELECT TIMESTAMPDIFF(MICROSECOND, started_at, NOW(3)) DIV 1000 FROM hunt_participants WHERE id = ?\"\n```\n\nSame reason `ago_s` in the activity feed is: mixing PHP's `time()` with MySQL's\nclock shifts every value by the PHP-to-MySQL timezone offset. On Hostinger that\nproduced a live feed where every event looked six hours old.\n\n---\n\n## Event modes\n\nThree modes, one setting. `huntMode()` is the only reader:\n\n```php\nfunction huntMode() {\n    $m = huntSetting('mode');\n    return in_array($m, ['timed', 'untimed', 'points'], true) ? $m : 'timed';\n}\n```\n\n| Mode | HUD | Ranked by | Needs completion? | Leaderboard query |\n|---|---|---|---|---|\n| `timed` (default) | Running clock | `total_ms` ASC, then `completed_at` ASC | Yes | SQL, `ORDER BY total_ms ASC, completed_at ASC LIMIT 10` |\n| `untimed` | No clock at all | `completed_at` ASC (finish order) | Yes | SQL, `ORDER BY completed_at ASC LIMIT 10` |\n| `points` | Score pill instead of a clock | `score` DESC, then earliest last-scan | **No** | `pointsBoard()` in PHP |\n\nAll three exclude `is_suspect = TRUE AND is_verified = FALSE`.\n\n### Absent means timed, and that is the backward-compatibility contract\n\n`junior trap`\n\n**Why** - modes were added after campaigns had already run. Every one of those\ncampaigns has no `mode` row. If absence meant anything other than `timed`, a\ndeploy would silently re-rank a finished event's leaderboard.\n\nThe save path makes the invariant permanent by refusing to write the default:\n\n```php\nif (in_array($m, ['timed', 'untimed', 'points'], true) && $m !== 'timed') {\n    saveHuntSetting($db, 'mode', $m);\n} else {\n    deleteHuntSetting($db, 'mode');   // timed is the default -> no row needed\n}\n```\n\nSo `mode` is never `\"timed\"` in the database. Switching back to timed **deletes**\nthe row rather than storing it. An unknown or corrupt value also lands on timed.\n\n**Spot it:** any code that reads `huntSetting('mode')` directly instead of\ncalling `huntMode()`. It will see `null` on a timed campaign and probably\nmishandle it.\n\n### Points mode is the one that ranks non-finishers\n\n`breaks things` if you forget it\n\n`pointsBoard()` ranks **anyone with a score above zero**, whether or not they\never complete. That single difference drives two other rules:\n\n- The player's own `rank` can exist while `completed` is false, so\n  `leaderboard.html` keys its \"Your Rank\" card off `d.rank`, not `d.completed`.\n- The anti-cheat gap check has to run at **scan** time, because completion - the\n  place it normally runs - may never happen. See \"Anti-cheat\".\n\n`pointsBoard` loads all participants and all scans into PHP and sorts there.\nThat is a deliberate event-scale choice (hundreds of players), cached per\nrequest. It is not a design that survives tens of thousands of rows.\n\n---\n\n## Engagement features\n\n### Unlock codes exist to undo the damage a timed hunt does to the stall\n\n`breaks things` commercially, not technically\n\n**Why** - a timed hunt optimises for speed, and the fastest possible visit to a\nbrand's poster is: point the phone, watch the chip tick, run. The brand paid for\nfootfall and got a photograph of their poster. The unlock code puts a human back\nin the loop: the poster **cannot be counted** until the visitor asks the stall\nstaff for a code, or answers a quiz whose answer is the code. That conversation\nis the product.\n\nThe handshake, in full:\n\n```mermaid\nflowchart LR\n    A[\"publicPosters()\u003cbr/>code_required: true\"] --> B[\"overlay knows a gate exists\u003cbr/>never the code\"]\n    B --> C[\"scan without code\"]\n    C --> D[\"server compares\u003cbr/>trim + lowercase\"]\n    D -->|\"mismatch\"| E[\"200 OK + need_code\u003cbr/>NO row, NO clock\"]\n    E --> F[\"#hunt-code prompt\"]\n    F --> G[\"scan again WITH code\"]\n    G --> D\n    D -->|\"match\"| H[\"row inserted\u003cbr/>enjoy card + offer\"]\n```\n\nFour things about it are load-bearing:\n\n**1. The raw code is never sent to a player.** `publicPosters()` ships a boolean:\n\n```php\n// A boolean so the overlay can prompt for a code; the code itself is\n// NEVER sent to players - only the stall/quiz answer holder has it.\n'code_required' => isset($p['unlock_code']) && trim($p['unlock_code']) !== '',\n```\n\n`huntPosterById()` does return the code, but only `handleScan` and the admin\nsettings endpoint call it.\n\n**2. A refusal is a 200, not an error.** `need_code` rides on a success response,\nso the overlay treats it as a prompt rather than a failure, and the offline queue\ndoes not retry it forever.\n\n**3. Nothing is recorded and the clock does not start.** The gate sits above both\nthe insert and the `started_at` UPDATE, so a visitor stuck at the prompt is not\nburning time.\n\n**4. The gate also applies to closed posters** - otherwise\nclose -> scan codeless -> re-open would count the poster with the code never\nentered.\n\nComparison is trimmed and case-insensitive on both sides\n(`mb_strtolower(trim(...))`), and runs only for a poster the participant has not\nalready recorded - re-scans never re-ask.\n\n### Per-poster offers\n\n`posters.\u003cid>.offer` is a string returned on the scan response and shown for 7\nseconds under the enjoy card. It ships only when the scan actually counted:\n\n```php\n$state['offer'] = (!$duplicate && $isOpen && $poster && trim($poster['offer']) !== '') ? trim($poster['offer']) : '';\n```\n\nIt is the softer version of the unlock code - \"show this screen at the counter\nfor a sample\" - and it costs the player no time, so it does not depress\ncompletion the way a code gate does.\n\n### Per-stall lead export\n\n`admin-export-stall&poster_id=X` joins `hunt_scans` to `hunt_participants` and\nemits Name, Phone, Company, Business Type, Scanned At, Player Code for everyone\nwho scanned that one poster. **This is the deliverable a brand pays for** - not\n\"impressions\", a named list with timestamps.\n\nEvery text field goes through `csvSafe()`, which prefixes `=`, `+`, `-`, `@`,\ntab and CR with an apostrophe. A lead named `=cmd|...` would otherwise execute\nwhen the brand opens the CSV in Excel.\n\n---\n\n## Admin controls\n\nFour independent switches, each its own setting so one can never clobber\nanother. All are live for every player and every screen on the next request -\nno restart, no rebuild, nothing cached beyond one request.\n\n| Control | Action | Setting | Effect |\n|---|---|---|---|\n| Registration open/close | `admin-set-registration` | `registration_closed` | New sign-ups get 403. Existing players resume, finish and rank normally. |\n| Leaderboard show/hide | `admin-set-display` | `leaderboard_off` | `leaderboard` returns `enabled:false` plus a goodbye message. **No names are returned at all while off.** |\n| Live feed show/hide | `admin-set-display` | `feed_off` | `activity` short-circuits before any query. Independent of the leaderboard. |\n| Per-target open/close | `admin-set-target-state` | `closed_posters` | Below. |\n\n\"Closing registration\" is deliberately not \"closing the hunt\". `handleRegister`\nruns the returning-player branch **before** the closed check, so someone\nmid-hunt who lost their tab can still get back in after the operator has closed\nsign-ups.\n\n### Target open/close: five invariants, all of them load-bearing\n\n`breaks things`\n\nA poster gets torn down, an aisle gets blocked, a stall packs up early. The\noperator closes that target and every player instantly plays with the rest:\nthe chip disappears, the counter becomes `x/(open count)`, completion and\nranking use the open set.\n\n**1. Scans are never deleted.** Closing writes an id into `closed_posters` and\ntouches no row in `hunt_scans`. Re-opening restores everyone's credit\nimmediately, because \"credit\" is just the filter `poster_id IN (open ids)`\napplied at read time.\n\n**2. A player holding all remaining targets completes automatically.**\n`maybeFinalizeCompletion` is called from `scan`, `status`, `start` **and**\n`resume` - not only from `scan`. Someone who was at 4/5 and never scans again\nis finished the next time their phone asks for status.\n\n**3. Their finish time is their LAST SCAN, never `NOW()`.**\n\n```php\nSET completed_at = (SELECT MAX(scanned_at) FROM hunt_scans WHERE participant_id = ? AND poster_id IN (...) AND scanned_at >= ?),\n    total_ms = TIMESTAMPDIFF(MICROSECOND, started_at, (SELECT MAX(scanned_at) ...)) DIV 1000\nWHERE id = ? AND completed_at IS NULL AND started_at IS NOT NULL\n```\n\nSomeone who finished their fourth poster ten minutes before the closure must not\nhave those ten minutes added to their time. The `WHERE completed_at IS NULL`\nguard also makes the completion happen exactly once under concurrent requests.\n\n**4. Off-clock scans cannot complete anyone.** Both the count and the `MAX()`\ncarry `scanned_at >= started_at`, and a scan of a **closed** poster from a\nplayer whose clock has not started is not recorded at all:\n\n```php\nif (!$isOpen && $participant['started_at'] === null) {\n    ... Response::success($state, 'Poster seen');   // seen, not stored\n}\n```\n\nWithout that, a re-open would hand out a poster whose walk time was never\ncounted, and it is the only route to \"all open posters scanned but `started_at`\nNULL\" - a state that can never finalize. A closed-poster scan **mid-hunt** is\nrecorded, because its timestamp is honestly on the clock.\n\n**5. The last open target cannot be closed.**\n\n```php\nif (count($closed) >= count(huntPosterIds())) {\n    Response::error('At least one target must stay open - re-open another target first', 400);\n}\n```\n\nWith zero open posters, `maybeFinalizeCompletion`'s \"holds every open poster\"\ntest is vacuously true for everyone. `maybeFinalizeCompletion` carries its own\n`if (!count($openIds)) { return false; }` as a second line of defence, because\nthe poster list can also empty out through a manifest swap.\n\n**Spot it:** any new caller of `openPosterIds()` that does not also handle the\nempty case, and any completion query that drops the `scanned_at >= started_at`\nclause.\n\n---\n\n## Player codes\n\nA 5-digit number, 10000-99999, printed on the registration screen and asked for\nat the prize desk. It exists because a token is 32 hex characters and a phone\nnumber is not something you shout across a booth.\n\n```php\nfor ($i = 0; $i \u003c 40; $i++) {\n    $code = strval(random_int(10000, 99999));\n    $changed = $db->execute(\n        \"UPDATE hunt_participants SET player_code = ? WHERE id = ? AND player_code IS NULL\",\n        [$code, $participantId]);\n    if ($changed > 0) { return $code; }\n    // 0 rows: another request assigned first - return what won\n```\n\nThree details worth keeping:\n\n- **No leading zero**, so the code survives a spreadsheet paste and a numeric\n  phone keyboard.\n- **The UNIQUE key is the arbiter, not a pre-check.** A collision throws 1062,\n  the loop tries a fresh number, 40 attempts before giving up. Callers treat a\n  `null` return as \"no code yet\" and nothing else breaks.\n- **`AND player_code IS NULL`** makes two concurrent assigns converge: the loser\n  gets 0 rows changed and returns whatever won.\n\nCodes are backfilled lazily. The migration fills at most 200 rows so one\npost-deploy request cannot hit `max_execution_time`, and `participantState`\nfills the rest one at a time as each player next touches the API.\n\n### Resume-by-code needs a throttle and one message, or it is an enumeration oracle\n\n`breaks things`\n\n**Why** - the code space is 90 000, and player names are **public on the\nleaderboard**. Without a throttle, scripting the space to hijack a named winner\nis an afternoon's work. Without a uniform error, the two failure modes leak:\n\n```php\n// WRONG - two distinguishable answers map the live code space\nif (!$existing) Response::error('No such code', 404);\nif (name mismatch) Response::error('That code belongs to someone else', 409);\n\n// RIGHT - one message for both, so a failure says nothing about the code\nif (!$existing || mb_strtolower(trim($existing['name'])) !== mb_strtolower($name)) {\n    resumeThrottleFail($db, $ip);\n    Response::error('No match - check the name and 5-digit code you registered with.', 404);\n}\n```\n\nThe budget is 50 failures per 5 minutes per `REMOTE_ADDR`\n(`HUNT_RESUME_MAX_FAILS`, `HUNT_RESUME_WINDOW_S`). That is loose enough for a\nwhole venue behind one NAT to fumble freely, and tight enough that a 90k sweep\ntakes days. A successful resume clears the IP's counter.\n\n`REMOTE_ADDR` and not `X-Forwarded-For` is deliberate - a forwarded header is\nattacker-controlled, so keying on it would make the throttle bypassable by\nrotating a string.\n\n---\n\n## Anti-cheat\n\nScan events are client-asserted. The engine does not pretend otherwise; it\napplies **plausibility floors** and hands genuinely fast runs to a human.\n\n```php\ndefine('HUNT_MIN_TOTAL_MS', 60000);   // faster than 60s across the whole hunt = suspect\ndefine('HUNT_MIN_GAP_MS', 10000);     // faster than 10s between posters = suspect\n```\n\nBoth are overridable live via the `floors` setting (`min_total_s`, `min_gap_s`).\nA flagged player gets `is_suspect = TRUE`, which removes them from the public\nleaderboard, from the live feed, and from their own `rank` - but **not** from\nthe admin table, the CSV, or their own progress.\n\n| Floor | Applies in | Checked at | Why there |\n|---|---|---|---|\n| Total time (`min_total_s`) | **timed only** | Completion | It is a statement about a *race time*. In untimed and points, `total_ms` ranks nobody, so flagging a fast total would hide honest quick players for no benefit. |\n| Gap between scans (`min_gap_s`) | every mode | Completion, **and scan time when mode is not timed** | It is a statement about *physics*: you cannot walk between two posters in under ten seconds. That is true whatever the scoreboard measures. |\n\n### The gap check has to run at scan time in points and untimed mode\n\n`junior trap`\n\n**Why** - `flagIfImplausible` runs from `maybeFinalizeCompletion`. In points\nmode, ranking does not require completion, so a forged rapid-fire run can be\nsitting at the top of the board having never triggered the completion path at\nall. Hence:\n\n```php\n$wasCompleted = maybeFinalizeCompletion($db, $participant['id']);\n// Points/untimed players are ranked BEFORE completing, so the gap floor\n// must run at scan time too - completion (which also gap-checks) may never\n// come. Skip when completion just ran it, and in timed mode (checked there).\nif (!$wasCompleted && $isOpen && !$duplicate && huntMode() !== 'timed') {\n    flagGapOnly($db, $participant['id']);\n}\n```\n\n`hasGapViolation` deliberately works with no completion and no `total_ms` - it\nreads the counted scan timestamps, sorts, and compares consecutive pairs. That\nis what makes it usable from both call sites.\n\n**Spot it:** any new public ranking surface that includes non-completers. It\nneeds a scan-time flag path too.\n\n### Verify is a person, not a heuristic\n\n`admin-verify` with `verified: true` sets `is_verified` **and clears\n`is_suspect`** - the operator looked the player in the eye. Turning it back off\nre-runs `flagIfImplausible`, so an implausible time returns to hidden rather than\nquietly re-entering the board. That re-run matters at exactly one moment: an\noperator who mis-clicks Verify on the wrong row and undoes it. Without it, the\nmis-click would be a permanent whitewash.\n\n---\n\n## Offline resilience\n\nVenue Wi-Fi fails. The overlay treats a failed scan as a queued scan, never as a\nlost one.\n\n```mermaid\nflowchart LR\n    F[\"arImageFound\"] --> P[\"POST scan\"]\n    P -->|\"network error\u003cbr/>or timeout\"| Q[\"queueAndTick()\"]\n    Q --> L[\"localStorage\u003cbr/>hunt_pending_scans\"]\n    Q --> T[\"optimistic chip tick\u003cbr/>+ 'saved, syncing' toast\"]\n    L --> FL[\"flushPending()\u003cbr/>every 5s\"]\n    FL -->|\"success\"| D[\"drop from queue\u003cbr/>applyState\"]\n    FL -->|\"success:false\"| R[\"drop + untick\u003cbr/>+ 'scan again'\"]\n    FL -->|\"no success field\"| K[\"keep retrying\"]\n```\n\nDesign points:\n\n- **8 second `AbortController` timeout** on every request. A hung request on\n  congested Wi-Fi must not freeze the state machine; a timeout falls through to\n  the queue path.\n- **The server timestamp is the arrival time**, not the scan time. Queued scans\n  therefore cost the player the outage. That is the fair choice: a\n  client-supplied timestamp would be the easiest cheat in the system.\n- **Three response classes, three behaviours.** Success drops the item.\n  `success: false` (bad poster id, dead token) also drops it and un-ticks the\n  optimistic chip - retrying a definitive rejection forever would wedge a fake\n  green chip and block completion. A body with **no** `success` field (a proxy\n  error page, a DB-error JSON) keeps retrying.\n- **`countScanned()` counts over the current poster list**, not\n  `Object.keys(state.scanned).length`. A queued id or a just-closed target would\n  otherwise show 3/4 when the truth is 2/4.\n\n### A queued scan that lands on a code-gated poster is dropped, not counted\n\n`junior trap`\n\n**Why** - the code was added to that poster while the scan sat in the queue, and\nthe queue has no code to offer. Returning `need_code` to a flush would leave the\nitem cycling forever, and treating it as success would count a gated poster with\nno code ever entered.\n\n```javascript\nif (res.data && res.data.need_code) {\n  dropPending(posterId);\n  delete state.scanned[posterId];        // undo the optimistic tick\n  state.count = countScanned();\n  renderChips();\n  toast('Scan the ' + (res.data.poster_label || labelOf(posterId)) + ' poster again to enter its code', 3500);\n}\n```\n\nThe player is told to scan the poster again, which is the only path that can\nproduce the prompt. The chip going back to grey is intentional and honest.\n\n### Three more client-side safety nets\n\n- **The analytics shim installs before the opt-in gate.** `Analytics.jslib`\n  calls `window.arAnalytics` from Unity on every acquisition, and that throws if\n  `ar-analytics.js` failed to load. The stub goes in for every build, hunt or not.\n- **Enablement is never inferred from a stored token.** Every build on the\n  domain shares one localStorage, so a token left from testing would light the\n  hunt HUD up on an unrelated campaign. The page must opt in with\n  `window.HUNT_CONFIG = { enabled: true }`, written at build time by\n  `Assets/Editor/HuntFlagPostBuild.cs`.\n- **`checkPosterIds()` shouts about id mismatches**, because a disagreement\n  between the Unity ids and the server list is otherwise **silent**: the camera\n  tracks, the meme plays, the scan is rejected, the chip never ticks. It compares\n  the server list against the page's `\u003cimagetarget>` tags and logs a\n  `console.error` naming the fix.\n\n---\n\n## Known limitations\n\nWritten down because a limitation you can name is a limitation you can price.\n\n**1. A scan is a claim, not a proof.** There is no cryptographic evidence the\ncamera ever saw the poster. `window.arAnalytics.arImageFound('Shoes')` typed\ninto a mobile console, or a bare POST to `?action=scan` with a token, is\nindistinguishable from a real scan. The floors catch the impatient; a cheat who\nwaits eleven seconds between forged scans is invisible.\n\n**2. There is no proof of presence, only proof of a request.** Nothing ties a\nscan to the venue - no GPS, no time-boxed poster nonce, no staff confirmation\nexcept where an unlock code happens to be configured. A remote friend with the\ntoken can play the whole hunt from another city.\n\n**3. The token is a bearer secret that travels in a URL.** It is in\n`?hunt_token=...` on the hop from the landing page to the AR build (scrubbed\nafter arrival, but present in history and in any referrer-logging proxy in\nbetween) and again on the hop to the leaderboard. Whoever holds it *is* that\nparticipant.\n\n**4. Codes leak, and there is no rotation.** An unlock code is a static string\nper poster. The first visitor who posts it in a WhatsApp group has disabled the\ngate for everyone. It raises the cost of skipping the stall; it does not make it\nimpossible.\n\n**5. Forcing engagement lowers completion.** Every code gate is a hard stop that\ndepends on a staff member being present, awake and willing. Expect fewer\nfinishers on a coded hunt than an ungated one - that is the trade being made,\nand it should be a deliberate decision per poster, not a default.\n\n**6. The phone resume path is neither throttled nor uniform.** Only the code path\ncalls `resumeThrottleGuard`, and the phone path returns a distinguishable 404\n(\"No registration found for this phone number\") versus 409 (name mismatch),\nconfirming whether a number is registered. Smaller hole than the code path would\nbe - the space is huge and phone numbers are not public - but a hole.\n\n**7. Nothing else is rate-limited.** `register`, `scan` and `status` have no\nper-IP budget at all.\n\n**8. Seeded players contaminate lead exports.** `admin-add-player` inserts real\n`hunt_scans` rows for **every** poster, so demo entries land in per-stall lead\nCSVs with an auto-generated `00...` phone. Remove them before handing a brand\nits list.\n\n**9. `pointsBoard()` is O(all scans) in PHP** on every points-mode ranking\nrequest. Fast at event scale; not a design that survives a much larger campaign.\n\n**10. Two settings are half-wired.** `leaderboard_over_msg` has no admin UI, and\n`branding.event_meta` is saved but rendered nowhere.\n\n**11. `hunt-overlay.js` is duplicated** across `iTracker/` and `iTracker6/`, with\nnothing keeping them in sync - a fix applied to one and not the other ships a\ndifferent game to different builds.\n"},{"id":"arrise-operations-md","title":"Operations Runbook","group":"ARRISE Platform","md":"# Running an ARRISE Event\n\n> **Job:** the event-day runbook. Written for the person standing at the booth\n> with a phone - what to set before doors, which one control to tap when\n> something goes wrong, how to hand out prizes, and what you can honestly\n> promise a brand.\n> **Update when:** an operator-facing control changes, or an event turns up a\n> failure that is not in the troubleshooting table.\n> **Do NOT put here:** how the engine works internally (that is\n> [HUNT_ENGINE.md](HUNT_ENGINE.md)) or how a build is made\n> ([ARCHITECTURE.md](ARCHITECTURE.md)).\n\nYou do not need to be a developer to run an event. Everything below is done in\na browser on your phone. Nothing here requires a rebuild, and every control is\nreversible.\n\nOne idea makes the rest make sense:\n\n**The server owns the campaign. The build only recognises pictures.**\n\nLabels, clues, scoring mode, which posters are live, whether sign-ups are open,\nbranding, ads - all of it lives in the admin panel and changes for everyone\nwithin seconds. If someone tells you a text change needs a new build, they are\nwrong.\n\n---\n\n## 1. The four URLs\n\n| Page | URL | Who opens it | What it is for |\n|---|---|---|---|\n| **Player landing** | `https://dashboard.rionick.com/hunt/` | Visitors, from the QR on every poster | Register (name, phone, consent), or resume a lost session. Hands the player over to the AR build. |\n| **AR build** | `https://rionick.com/AR/memehunt/` | Opened automatically by the landing page | The camera experience. Chips, timer, clues, memes, completion card. Do not print this URL on posters. |\n| **Leaderboard** | `https://dashboard.rionick.com/hunt/leaderboard.html` | Players, and the booth screen | Top 10, live activity feed, the visitor's own rank. Add `?tv=1` for the booth screen. |\n| **Hunt admin** | `https://dashboard.rionick.com/hunt/admin.html` | You | Everything in this document. |\n\n```mermaid\nflowchart LR\n    QR[\"QR on poster\"] --> Landing[\"Player landing\u003cbr/>register / resume\"]\n    Landing --> AR[\"AR build\u003cbr/>scan posters\"]\n    AR --> Board[\"Leaderboard\"]\n    You[\"You - hunt admin\u003cbr/>on a phone\"] --> Server[(\"Campaign settings\u003cbr/>+ player data\")]\n    Landing --> Server\n    AR --> Server\n    Board --> Server\n```\n\n**The QR on the printed poster must point at the landing page, not at the AR\nbuild.** A player who lands straight on the AR build has no session: they get a\nregistration gate instead of a camera, which reads as broken.\n\n**Login:** the hunt admin uses the same account as the main ARRISE admin panel.\nType either the username or the account email. If you are already logged into\nthe main panel on that phone, the hunt admin opens straight in.\n\nThe admin page refreshes itself every 15 seconds, so two staff phones stay in\nsync without anyone pressing Refresh.\n\n---\n\n## 2. Before doors\n\nDo these in order. Steps 1 and 10 are the two that ruin an event when skipped.\n\n### 2.1 Load the poster list from Unity\n\n`breaks the whole hunt if skipped`\n\nThe AR build has its own internal name for each poster, baked in when it was\nbuilt. The server scores against the list *you* give it. If those two lists\ndisagree, **the meme still plays and the chip never ticks** - the most\nconfusing failure this platform has.\n\nIn Unity: **Tools > Meme Hunt > 3. Copy Poster List JSON**. That copies the\nbuilt scene's real poster ids to the clipboard and writes `hunt-posters.json`\nat the project root. Paste it into **Settings > Poster list** and Save. The\npanel shows you the ids it accepted and confirms \"saved list\" rather than\n\"built-in default\".\n\nAnyone can do this without Unity by sending you `hunt-posters.json` from the\nrepo root - a plain text file of `{\"id\":..., \"label\":..., \"hint\":...}` entries.\n\nThe server's own built-in list (`FIFA_Target`, `One8Traget`, `BookCover`,\n`CultGym`, `Shoes`) is from the old test build. **If you see those ids live and\nyour posters are the new ones, nothing anybody scans will count.**\n\nChanging the poster list mid-event invalidates hunts already in progress - do\nit before doors, then Reset All Data.\n\n### 2.2 Labels and hints\n\nUnder Settings, each poster gets:\n\n- **Label** - the short caption on the player's chips, up to 20 characters.\n- **Hint** - the clue shown *after the previous poster is found*, up to 300\n  characters. Write it as directions a stranger can follow: \"near the food\n  court entrance, next to the blue pillar\".\n- **Up / down arrows** next to each poster id reorder the hunt. They save\n  instantly and are safe mid-event - players keep every scan they already have.\n\nAll of it is editable during the event from your phone. Walk the venue once and\nfix the hints that turn out to be wrong.\n\n### 2.3 Choose the mode\n\nAdmin panel: **Settings -> Event Mode**.\n\n| Mode | Ranked by | Use it when |\n|---|---|---|\n| **Timed** (default) | Fastest total time | You want a race and a clear winner. Trade shows, competitive crowds. |\n| **Untimed** | Who finished first, no clock | You want people to explore, not sprint. Families, long venues. |\n| **Points** | Total score, each poster carries a points weight | Engagement events - weight the stalls that paid more, and players are ranked as they go, without finishing. |\n\nIn Points mode set each poster's **Points** value in the Settings poster rows.\nIn Timed and Untimed the Points column is ignored.\n\n### 2.4 Anti-cheat floors\n\nTwo numbers, both under Settings:\n\n- **Min total time (seconds)** - a completion faster than this gets flagged.\n- **Min gap between posters (seconds)** - two scans closer together than this\n  gets flagged.\n\n**How to set them:** walk the real route yourself at a brisk pace and time it.\nSet the total floor to roughly 60-70% of your honest time, and the gap floor to\nabout half of your fastest walk between two adjacent posters. Too high and you\nflag honest players; too low and it catches nobody.\n\nA flagged player is marked **SUSPECT** in your table and is **hidden from the\npublic leaderboard and the live feed** until you press Verify. They are not\nblocked - they keep playing and never see the flag. The total-time floor\napplies in Timed mode only; the gap floor applies in every mode.\n\n### 2.5 Next Clue delay\n\n**\"Next Clue\" button delay (seconds after scan)** - how long the meme gets to\nplay before the player can move on. Set it to roughly the meme length minus one\nsecond. Too short and nobody watches the content; too long and it feels stuck.\n\n### 2.6 Sequential or any order\n\n**Sequential** forces posters to be found in the listed order. Use it when the\nroute has a natural path and you want to control crowd flow; leave it off when\nposters are spread across a hall and queues would form. With it on, a player\nwho scans out of order is told which poster to find next, and their clock does\nnot start on the rejected scan.\n\n### 2.7 Branding\n\nSettings > Branding sets the event name, dates and venue line, brand name, hunt\ntitle, accent colour, powered-by footer, and the leaderboard call-to-action -\ndriving the AR overlay, the landing page, the leaderboard and the shareable\nvictory card in one go.\n\nIn **Brand name**, the part after the `|` is drawn in the accent colour:\n`AR|RISE` renders \"AR\" in white and \"RISE\" in red. The CTA link must start with\n`https://` or it is ignored.\n\n### 2.8 Sponsor ads\n\nUp to four full-screen closeable images, each with an optional click-through\nlink. The
