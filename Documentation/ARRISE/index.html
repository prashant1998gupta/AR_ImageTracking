y rotate: ad 1 after the first scan, ad 2 after the second, and so on;\nfewer ads simply repeat. They **never** appear before the first scan and\n**never** on the completion screen.\n\nImage URLs must start with `https://`. Upload the images into the `hunt/`\nfolder using the hosting file manager, then paste their URLs. Leave every image\nfield empty to disable ads.\n\n### 2.9 Unlock codes and stall offers (optional - see section 6)\n\nEach poster row also has:\n\n- **Unlock code** - a word or number the visitor must type for the poster to\n  count. Only the stall staff know it. Leave empty for a free scan.\n- **Stall offer** - text shown to the player right after they scan that poster\n  (\"show this screen at the counter for a free sample\").\n\nThe code is never sent to players' phones. Wrong code shows \"that code is not\nright - check with the stall\" and records nothing.\n\n### 2.10 Reset All Data\n\n`deletes everything - do it before doors, never during`\n\n**Reset All Data** wipes every participant and every scan, including your test\nruns. You must type `RESET` to confirm. Do this once, after you have finished\ntesting and before the first real visitor.\n\nIt does **not** clear your settings - poster list, labels, hints, floors, mode,\nbranding and ads all survive.\n\n### 2.11 Booth screen\n\nOn the booth laptop: Chrome -> `leaderboard.html?tv=1` -> F11 for fullscreen.\n`?tv=1` scales the page 1.6x so it reads from across an aisle. Tap the bell icon\nonce, by hand, so the browser allows the finish chime - browsers block sound\nuntil a real click happens, so this cannot be automated.\n\n### 2.12 Final checks\n\n1. Registration card shows **Registration OPEN**, every target shows **OPEN**.\n2. Scan one poster yourself end to end, then Remove your own row.\n3. Posters printed matte at A3 or larger. Glossy paper under venue spotlights\n   is the single most common tracking failure.\n4. Booth phones charged, and a power bank at the help desk.\n\n---\n\n## 3. During the event: which control, when\n\nEvery control on the admin page is one tap, applies to everyone within seconds,\ndeletes nothing, and can be undone.\n\n| What just happened | Tap this | What players see |\n|---|---|---|\n| A poster is torn, stolen, or its area is blocked | **Targets** card -> that poster -> Close | It vanishes from their chips. The counter becomes x/(remaining). Nobody needs it to finish. |\n| The area reopened / poster reprinted | **Targets** card -> that poster -> Open | It comes back, and everyone who had already scanned it gets their credit back instantly. |\n| Someone lost their session, closed the tab, or switched phone | Send them to the landing page -> \"Already registered? Resume\" | They resume with everything they had. |\n| A run looks impossible | Their row shows **SUSPECT** already | They are already off the public board. Verify in person before awarding. |\n| A staff or test run is sitting in the prize positions | **Remove** on that row | Ranks below shift up instantly. |\n| Board looks empty early on, and it is discouraging people | **Add Player to Leaderboard** | Seeds a finished entry so the board is not blank. |\n\n### 3.1 Poster damaged, or an area is blocked\n\nThe **Targets** card lists every poster as a button. Tap one to close it.\n\n**What closing actually does:** the poster disappears from every player's chips,\nstops being required to finish, and the sequential order skips over it. Scans\nalready recorded are **kept** - reopening restores everyone's credit. A player\nwho already holds all the remaining open posters is finished automatically, and\ntheir finish time is taken from their **last scan**, not from the moment you\nclosed the target - so nobody is punished for the time between. The last\nremaining open target cannot be closed; the panel refuses and tells you to\nreopen another first.\n\n### 3.2 Someone lost their session\n\nSend them to the landing page and tap \"Already registered? Resume your hunt\".\nThey need their **name**, plus **either**:\n\n- the **phone number** they registered with, or\n- their **5-digit player code**.\n\nThe name must match what they registered with, either way - a phone number\nalone will not hand over somebody else's session.\n\nIf they remember neither, find them in your admin table by name; the table\nshows both their phone and their code. If they typed a wrong code several\ntimes, the server may make them wait a few minutes - that is the brute-force\nguard, and it clears itself. The AR page's own gate carries the same \"Already\nregistered? Resume your hunt\" link.\n\n### 3.3 Someone looks like a cheat\n\nYou do not have to spot this yourself. A run that beats your floors is\nauto-flagged **SUSPECT** and is already invisible on the public leaderboard and\nthe live feed. It stays visible to you.\n\nTo clear it: ask them, in person, to scan one poster in front of you. If they\ncan, press **Verify** on their row. That clears the flag and puts them back on\nthe public board. Pressing Verify again removes verification and re-runs the\ncheck.\n\n**Verify every prize winner in person, flagged or not.** Scans are asserted by\nthe phone; the in-person check is the real control.\n\n### 3.4 Seeding the board (optional)\n\n**Add Player to Leaderboard** inserts a finished, pre-verified run - for when\nthe board is empty in the first half hour and that is putting people off. The\n**Generate** button fills the form with a plausible name and time to review\nbefore adding. Two rules:\n\n- **Leave the phone field empty.** The server then assigns a number starting\n  `00`, which no real phone can produce - that is how you spot seeded rows\n  later, and it means you cannot accidentally block a real visitor from\n  registering.\n- **Do not touch the Verified button on a seeded row.** Switching it off can\n  hide the entry as SUSPECT.\n\nSeeded rows are marked **ADDED** in your table only. On the public board they\nlook like any other player.\n\n---\n\n## 4. Prizes\n\n1. Sort by rank in the admin table - rank 1 is at the top.\n2. Ask the claimant for their **5-digit player code** and find that row. The\n   code beats searching by name (duplicates) or phone (nobody remembers it).\n3. Verify in person: ask them to scan any one poster while you watch.\n4. Press **Verify** on their row. If they were flagged SUSPECT, this also puts\n   them back on the public leaderboard.\n5. Award the prize.\n6. Before awarding, scan the table for the same person appearing under two\n   phone numbers. Multiple numbers means multiple attempts, and the system\n   does not prevent it.\n\n**Export CSV** downloads the full table including the Code column - useful as a\nrecord after the event, and as the list you reconcile prizes against.\n\n---\n\n## 5. Wrapping the event\n\nDo these two in order. They are separate controls because they do different\nthings.\n\n```mermaid\nflowchart LR\n    A[\"Registration -> Closed\"] --> B[\"Wait for people mid-hunt to finish\"]\n    B --> C[\"Public Displays -> Leaderboard HIDDEN\"]\n    C --> D[\"Optional: Reset All Data before the next event\"]\n```\n\n| Control | New visitors see | People already mid-hunt |\n|---|---|---|\n| **Registration -> Closed** | \"This hunt has ended\" instead of the sign-up form. They cannot join. | **Nothing changes.** They resume, scan, finish, and the leaderboard keeps updating. |\n| **Leaderboard -> HIDDEN** | The leaderboard page swaps the rankings, the live feed and the \"your rank\" card for a \"The Hunt Is Over - back soon\" card. | They can still scan and finish. Their own time and rank still appear inside the AR experience. Only the public page changes. |\n| **Live Feed -> HIDDEN** | The activity ticker disappears. Rankings stay up. | No effect at all. |\n\nSo: **close registration when the campaign ends, and hide the leaderboard only\nonce play has actually stopped.** Hiding the board while people are still\nhunting takes away the thing they are hunting for.\n\nEverything here is reversible - reopening a display shows every ranking again,\nnothing was deleted. Before the *next* event, run **Reset All Data** to clear\nplayers while keeping your settings.\n\n---\n\n## 6. What you can honestly sell a brand\n\nThis section exists because a stall owner once complained, correctly, that\nvisitors scanned his poster and walked away.\n\n### What the platform actually delivers\n\n| Promise | How it is delivered | Where the proof is |\n|---|---|---|\n| **Footfall to a specific stall** | Their poster is a required stop on the route. Players must physically stand in front of it. | Their row in the admin table; the per-poster scan count. |\n| **A lead list per stall** | Everyone who scanned that stall's poster, with contact details. | **Stall Leads (per poster)** -> pick the stall -> Download CSV. Columns: Name, Phone, Company, Business Type, Scanned At, Player Code. |\n| **Dwell at the poster** | The AR build reports how long each target stayed in view. | The ARRISE analytics dashboard, `ar_scan_duration` per target. |\n| **Brand recall** | Their content plays full-screen on the visitor's own phone for several seconds, with sound. Plus optional full-screen sponsor interstitials between clues. | Scan counts, plus the dwell figure above. |\n| **Reach beyond the hall** | The completion screen generates a personalised victory card the player shares to WhatsApp, carrying the event and brand name. | Anecdotal - shares are not tracked. Do not put a number on this. |\n\n### What it does not deliver\n\n**A purchase.** No point-of-sale integration, no redemption tracking, no way to\nprove a scan turned into a sale. If a brand asks for conversion, the honest\nanswer is: we deliver a qualified visitor to the counter with their phone\nalready out, and hand you their contact details. Closing them is the stall's\njob.\n\n**Verified attendance.** A scan means a phone saw that image. It does not prove\nthe person stood at the stall rather than photographing the poster elsewhere.\n\n**A guaranteed conversation with staff** - unless you use the play below.\n\n### The play for \"they scanned and ran\"\n\nThis is what the unlock code and stall offer fields exist for.\n\n1. Set an **unlock code** on that brand's poster. The poster does not count\n   until the visitor types it.\n2. The stall staff hold the code. The only way to get it is to walk up and ask.\n3. Set a **stall offer** on the same poster - the text shown right after the\n   scan lands (\"show this screen for a free sample\").\n4. In Points mode, give that poster a heavier **points** weight so it is worth\n   the detour.\n\nThe visitor now has to talk to a human before their scan counts. That is a\nconversation you can honestly sell, and it is measurable: everyone in that\nstall's leads CSV completed the code step.\n\nBe straight about the cost: a gated poster is slower and slightly more\nfrustrating than a free one. Do not gate every poster. One or two paying stalls\nis the right number.\n\n---\n\n## 7. Troubleshooting\n\n| Symptom | Likely cause | Fix |\n|---|---|---|\n| **The meme plays but the chip never ticks.** Every poster, every player. A message flashes about an unknown poster. | The poster ids in Settings > Poster list do not match the ids inside the AR build. The server is scoring against a different list. | Get `hunt-posters.json` from the build (Unity: **Tools > Meme Hunt > 3. Copy Poster List JSON**), paste it into **Settings > Poster list**, Save, then **Reset All Data**. Check the panel says \"saved list\", not \"built-in default\". |\n| **No registration screen at all.** The AR page loads and tracks posters, but there are no chips, no timer, no sign-up gate. | The build shipped with the campaign switched off - `window.HUNT_CONFIG = { enabled: false };` in the build's `index.html`. | In the hosting file manager, open `index.html` in the deployed AR build folder, change `enabled: false` to `enabled: true`, save, and hard-reload. No rebuild needed. For the permanent fix the scene needs `huntEnabled` ticked on its `CampaignSettings` before the next build. |\n| **A poster tracks but the video never appears** (black or blank plane). | The video file was never pushed to GitHub, or the CDN is still serving the old version of that path. | Confirm the file is committed and pushed under `videos/`. jsDelivr caches an `@main` URL for up to 12 hours, so a just-pushed file can still 404. Ask a developer to purge that URL, or wait it out. Meanwhile close that target so the hunt continues on the rest. |\n| **Video plays with no sound on iPhone.** Android is fine. | Apple blocks audio until the user taps. The build shows an \"Enable Sound\" card for exactly this. | Tell the player to tap the Enable Sound card. If they missed it, tapping anywhere on the screen usually unlocks it. Also check the phone's physical silent switch - it mutes web video on iOS. |\n| **A player swears they registered, but the site shows the sign-up form.** | Different browser, cleared storage, or they opened the link from inside another app. | Landing page -> \"Already registered? Resume\" -> name plus phone **or** 5-digit code. |\n| **\"This phone number is already registered under a different name.\"** | Someone else used that number, or they typed their name differently from registration. | Look their number up in your admin table to see the registered spelling and tell them to use it. If it is genuinely a stale test row, **Remove** it and let them register again. |\n| **A poster is missing from the players' chips.** | It is closed in the Targets card. | Targets card -> tap it -> Open. Everyone's earlier scans come back with it. |\n| **Someone finished but is not on the public leaderboard.** | They were flagged SUSPECT by the anti-cheat floors. | Their row shows SUSPECT. Verify them in person, press **Verify**, and they appear. If honest players are being flagged all day, your floors are set too high. |\n| **The booth screen is tiny / has no sound on new finishes.** | `?tv=1` missing, or the browser has not been given a click. | Use `leaderboard.html?tv=1` in Chrome, press F11, and tap the bell icon once by hand. |\n| **Admin page keeps bouncing to the login screen.** | The session token expired. | Log in again with the same username or email. |\n| **A settings change has not reached a player.** | Their screen was already open. | Settings reach a player on their next scan or page load, not retroactively. Ask them to reload, and press Refresh in the admin bar to confirm the value saved. |\n\n### When something is genuinely broken and you need to buy time\n\nClose the affected target. The hunt continues on the remaining posters, nobody\nis stuck, nothing is lost, and you can reopen it the moment it is fixed. That\none button is your fallback for almost every physical problem at the venue.\n\n---\n\n## 8. Honest limits - tell your client before, not after\n\nScans are asserted by the player's phone. There is no cryptographic proof the\ncamera saw the poster. That means:\n\n- A determined person can forge scans by calling the API directly. The\n  SUSPECT floors and your in-person verification are what catch it - they do\n  not prevent it.\n- A photographed poster can be scanned off another phone's screen. The min-gap\n  floor catches the fast version; the in-person check catches the rest.\n- More phone numbers means more attempts. Check the table for the same name\n  appearing twice before awarding prizes.\n\nThe system also collects real personal data - names and phone numbers, with\nconsent. **Phone numbers appear only on the admin pages and in the CSV\nexports.** The public leaderboard and live feed show first names only. Treat\nthe exported CSVs the way you would treat any customer list.\n"},{"id":"arrise-script-catalog-md","title":"Script Catalog","group":"ARRISE Platform","md":"# ARRISE Script Catalog\n\n> **Job:** one table of every file in this repo that Rionick Studios wrote, so a\n> new developer can find the owner of any behaviour without opening 40 files.\n> **Update when:** you add, rename, move or delete any file listed below.\n> **Do NOT put here:** how the systems fit together (that is ARCHITECTURE.md),\n> Unity rules and traps (that is ../Engineering/UNITY-TRAPS.md), or deployment\n> steps (that is ar-analytics/DEPLOYMENT_GUIDE.md).\n\n**This catalog is HAND-MAINTAINED. There is no generator.** Car Academy's\nequivalent file is produced by a PowerShell script; this one is not. Nothing\nwill notice if it goes stale, so the rule is: **the commit that adds a file adds\nits row here.** A row costs thirty seconds. A missing row costs the next person\nan afternoon of grepping.\n\nCovered here: `Assets/Scripts` (8), `Assets/Editor` (11), the parts of\n`Assets/WebGLTemplates/iTracker` we own (2) plus the vendor files we must not\ntouch (3), `ar-analytics/api` controllers (6) and helpers (3), and the hunt\nplayer/admin pages (3).\n\nNot covered: `Assets/Imagine/**` (the licensed Imagine WebAR plugin),\n`Assets/Plugins/**`, `WebGLBuild/**` (build output), and `ar-analytics/sql`,\n`ar-analytics/tracker`, `ar-analytics/admin`, `ar-analytics/dashboard`.\n\n---\n\n## How a campaign gets built\n\nRead this once and most of the table below explains itself. The scene decides\nwhat kind of campaign it is; everything downstream reads that decision.\n\n```mermaid\nflowchart LR\n  A[Scene with\u003cbr/>CampaignSettings] --> B[PreBuildCheck\u003cbr/>pre-flight, can block]\n  B --> C[Unity WebGL build\u003cbr/>template = iTracker]\n  C --> D[HuntFlagPostBuild\u003cbr/>AnalyticsKeyPostBuild]\n  D --> E[built index.html\u003cbr/>HUNT_CONFIG + data-project]\n  E --> F[hunt-overlay.js\u003cbr/>HUD, gate, scoring]\n  F --> G[hunt.php\u003cbr/>MySQL truth]\n```\n\nTwo things are decided at BUILD time and cannot be changed afterwards: the image\ntarget ids, and the two flags patched into `index.html`. Everything else - poster\nlabels, hints, points, branding, which targets are open - is live server settings.\n\n---\n\n## The table\n\n| Area | File | Kind | Purpose | Depends on / boundary |\n|---|---|---|---|---|\n| Unity runtime | [ARContentScale.cs](../../Assets/Scripts/ARContentScale.cs) | MonoBehaviour | Sets the AR content's `localScale` at `Start`, preferring `?scale=` (or `?ar_scale=`) from `Application.absoluteURL` over the baked value, clamped to `minScale`/`maxScale`. Must sit on a child object BETWEEN the tracker's target root and the visible content: `ImageTracker.ParseData` hard-assigns the root's localScale every tracked frame, so a scale written there is wiped silently. | Imagine ImageTracker (as a constraint, not a reference) |\n| Unity runtime | [CampaignSettings.cs](../../Assets/Scripts/CampaignSettings.cs) | MonoBehaviour (data only) | Declares, per scene, whether this is a hunt campaign (`huntEnabled`) and which analytics project it reports into (`analyticsApiKey`). No Update, no cost at runtime - it exists purely so the two post-build steps can read the answer off the scene instead of a human remembering it. Empty `analyticsApiKey` means \"ship with no analytics at all\". | Read by HuntFlagPostBuild, AnalyticsKeyPostBuild, BootSceneCampaign, PreBuildCheck |\n| Unity runtime | [CDNARVideoController.cs](../../Assets/Scripts/CDNARVideoController.cs) | MonoBehaviour | Streams a CDN-hosted meme/product video onto a tracked plane. In `Awake` it moves the VideoPlayer onto a new `DontDestroyOnLoad` object and disables the original, because the tracker disables the tracked GameObject on loss and that would tear down the WebGL video buffer - the clone keeps buffering so a retrack resumes instantly. Also holds the renderer disabled until real frames arrive (white-flash guard), and mutes-then-unmutes for the iOS autoplay gate. | UnityEngine.Video, `Helpers.jslib` (`RequiresWebGLSoundUnlock`, `GetWebGLSoundUnlockSerial`, `SetWebGLCurrentTargetKey`) |\n| Unity runtime | [ShareManager.cs](../../Assets/Scripts/ShareManager.cs) | MonoBehaviour | Calls a page-level JavaScript `shareText(text, url)` from WebGL builds. **Inert as shipped:** no `shareText` is defined anywhere in this repo, including the iTracker template, so both methods currently reach nothing. Define it in the template before wiring a share button. | `Application.ExternalCall` / `ExternalEval` (WebGL only) |\n| Unity runtime | [ExampleUsage.cs](../../Assets/Scripts/ExampleUsage.cs) | MonoBehaviour | Sample wiring: clears a Button's listeners and points it at `ShareManager.ShareText` with a hard-coded example.com link. Reference material for the share flow, not a shipping component. | Unity UI, ShareManager |\n| Unity runtime | [UIManager.cs](../../Assets/Scripts/UIManager.cs) | MonoBehaviour | Wires one \"contact\" button to `Application.OpenURL(\"https://rionick.com/contact-us\")`. The other serialized fields (`firstCanvas`, `startButton`, `backButton`) are declared but unused. | Unity UI |\n| Unity runtime | [SliderAnimationController.cs](../../Assets/Scripts/SliderAnimationController.cs) | MonoBehaviour | Toggles an Animator between `IsOn` and `IsOff` triggers on each button press. Generic UI helper, no AR knowledge. | Unity UI, Animator |\n| Unity runtime | [RotateAndAutoReset.cs](../../Assets/Scripts/RotateAndAutoReset.cs) | MonoBehaviour | Lets the user spin an object with mouse or touch, then lerps it back to its start pose over `resetDuration` when they let go. Compiles the mouse path for `UNITY_WEBGL`, so on a phone browser it reads mouse axes, not touches. | Unity Input (legacy) |\n| Unity editor | [MemeHuntSceneBuilder.cs](../../Assets/Editor/MemeHuntSceneBuilder.cs) | Scene generator | `Tools > Meme Hunt > 1/2/3`. Discovers posters from `Assets/AR_Assets/AR Meme Hunt` by leading number (the number IS the hunt order), clones `Demo-Video.unity`, strips its demo targets, rebuilds each poster procedurally, registers them in ImageTrackerGlobalSettings, adds `CampaignSettings` with `huntEnabled`, makes MemeHunt the only enabled build scene, and exports `hunt-posters.json` for the server. Idempotent - re-running deletes and re-clones. Adding a poster is copying a file in. | Imagine.WebAR, ImageTrackerGlobalSettings, CampaignSettings |\n| Unity editor | [RishabhSceneBuilder.cs](../../Assets/Editor/RishabhSceneBuilder.cs) | Scene generator | `Tools > Rishabh > Build Rishabh Scene`. Builds the Rishabh AR visiting card from `Demo-VisitingCard.unity`: two targets (front and back of the printed card, each with a complete copy of the content), video plane, World Canvas of tappable link quads laid out from the CONFIG table, all links routed through `Imagine.WebAR.Samples.GoToUrl`. The analytics key is a constant in this file as well as on the scene's CampaignSettings, because a rebuild deletes the scene and would lose an inspector-only value. | Imagine.WebAR, Imagine.WebAR.Samples, CampaignSettings |\n| Unity editor | [RishabhLayoutTools.cs](../../Assets/Editor/RishabhLayoutTools.cs) | Editor utility | Two commands that make hand-arranging the card survivable. `Sync UI To All Targets` copies the first target's arranged UI onto every other target (it never touches the video object, CDNARVideoController, materials, meshes or the Canvas components, and never saves the scene). `Read Layout From Scene` inverts the builder's own maths and rewrites `RishabhSceneBuilder.cs` between its AUTO markers, after a timestamped `.bak`, aborting without writing a byte if anything does not line up. | RishabhSceneBuilder.cs (edits its source text) |\n| Unity editor | [ARAutomationWindow.cs](../../Assets/Editor/ARAutomationWindow.cs) | Editor wizard | `Tools > AR Setup Automation`. Step-by-step generator for a single-target AR video scene from `Demo-Video.unity`: validates and one-click-fixes texture Read/Write, sanitises the target id, checks the CDN URL, derives the video mesh from a first-frame image, and supports green-screen (parent = tracking quad, child = chroma-key video plane). Does NOT add `CampaignSettings` - a scene made here reports into the template's default analytics project until you add one. | Imagine.WebAR, UnityEngine.Video |\n| Unity editor | [ARCardSetupWindow.cs](../../Assets/Editor/ARCardSetupWindow.cs) | Editor wizard | `Tools > AR Card Setup Wizard`. The visiting-card counterpart of the above, built from `Demo-VisitingCard.unity`: card background sprite, optional (green-screen) video overlay, and Instagram / Facebook / YouTube / website / phone / email / VCF link buttons. Same caveat - it does not add `CampaignSettings`. | Imagine.WebAR, Imagine.WebAR.Samples, UnityEngine.Video |\n| Unity editor | [PreBuildCheck.cs](../../Assets/Editor/PreBuildCheck.cs) | Build gate | Pre-flight validation for every ARRISE WebGL build, wired through three doors: a `BuildPlayerWindow` handler installed by `[InitializeOnLoadMethod]`, `IPreprocessBuildWithReport` at `callbackOrder = -100`, and `[PostProcessScene(-100)]` as the authoritative net that throws `BuildFailedException`. Every check corresponds to something that has already shipped broken silently - missing CampaignSettings, an unregistered target, duplicate target filenames, a bad analytics key, the wrong WebGL template. Skipped in batch mode except for the PostProcessScene net. | UnityEditor.Build, Imagine.WebAR, CampaignSettings, PreBuildDialog |\n| Unity editor | [PreBuildDialog.cs](../../Assets/Editor/PreBuildDialog.cs) | Editor window | The modal window PreBuildCheck shows: which campaign is shipping, hunt on or off, whose analytics project, then every issue with its one-click fix. Modal on purpose so a red banner cannot be scrolled past in the Console. Applying a fix mid-build CANCELS that build, because half-edited assets would be picked up inconsistently. Falls back to a native dialog if Unity refuses the custom modal. | PreBuildCheck types (`PreBuildIssue`, `PreBuildSummary`) |\n| Unity editor | [HuntFlagPostBuild.cs](../../Assets/Editor/HuntFlagPostBuild.cs) | Post-build patch | `[PostProcessBuild(100)]`. Regex-rewrites `window.HUNT_CONFIG = { enabled: ... }` in the built `index.html` from the boot scene's `CampaignSettings.huntEnabled`. This is the switch that keeps the hunt HUD out of visiting-card and product builds, which share one template and one browser localStorage. When `[PostProcessScene]` did not run it falls back to BootSceneCampaign rather than defaulting to false. | CampaignSettings, BootSceneCampaign |\n| Unity editor | [AnalyticsKeyPostBuild.cs](../../Assets/Editor/AnalyticsKeyPostBuild.cs) | Post-build patch | `[PostProcessBuild(101)]`. Rewrites the `data-project` attribute on the `ar-analytics.js` script tag from `CampaignSettings.analyticsApiKey`, so each campaign reports into its own project instead of the template's hard-coded one. An EMPTY key removes the whole script tag; no CampaignSettings at all leaves the tag as the template ships it. Validates the key shape (64 hex chars, matching `Auth::generateApiKey`). | CampaignSettings, BootSceneCampaign |\n| Unity editor | [BootSceneCampaign.cs](../../Assets/Editor/BootSceneCampaign.cs) | Editor utility | Parses the boot scene's `.unity` YAML on disk to recover `huntEnabled`, `analyticsApiKey` and `campaignName` without the scene being open. Exists because `[PostProcessScene]` is NOT guaranteed to run - Unity skips it when an incremental build reuses cached scene data, and the two post-build steps then silently wrote \"not a hunt\" into a hunt build for six consecutive builds during a live event. Requires Force Text asset serialization; if that is off, `Found` comes back false and callers say so loudly. | EditorBuildSettings, text-serialized scenes |\n| Unity editor | [CustomPlaneGenerator.cs](../../Assets/Editor/CustomPlaneGenerator.cs) | Editor utility | `Tools > Custom Plane Generator`. Makes a correctly-proportioned quad mesh from pixel dimensions (default multiplier `0.001`, so 1080 becomes 1.08 Unity units) in XZ-horizontal or XY-vertical orientation, exported as OBJ, FBX or a `.asset` mesh. Used to hand-make the video/tracking planes the wizards otherwise generate. | UnityEditor mesh/asset API |\n| WebGL template | [hunt-overlay.js](../../Assets/WebGLTemplates/iTracker/hunt-overlay.js) | Ours - overlay | The entire Meme Hunt player experience, injected after `ar-analytics.js` and before the Unity loader. It wraps `window.arAnalytics` to intercept image-found events, so no C# change is needed to score a scan. Guarded by an explicit opt-in: without `HUNT_CONFIG.enabled === true` (or `?hunt=1`) it does nothing at all - no HUD, no network, no localStorage - and enablement is deliberately NOT inferred from a stored token, because every build on the domain shares one localStorage. Owns the token intake, the offline scan queue, the timer/points modes, poster chips, clue cards, unlock-code prompt, sponsor interstitials and the canvas-drawn victory card. | window.arAnalytics (Analytics.jslib), hunt.php, `HUNT_CONFIG` from index.html |\n| WebGL template | [index.html](../../Assets/WebGLTemplates/iTracker/index.html) | Ours - page shell | The page every campaign ships as. Carries the ARRISE loading screen, the iOS sound-unlock overlay (whose state `Helpers.jslib` reads back into C#), the screenshot / confirm-URL / error panels, and the two lines the post-build steps patch. Its FIRST script is the AR watchdog: it catches opencv.js WASM aborts before Unity's loader can `alert()` on them, soft-restarts the tracker, silences benign `AbortError`/`NotAllowedError` media noise by attaching a no-op catch to `HTMLMediaElement.prototype.play`, and performs a budgeted automatic reload if the engine is truly dead. | Unity WebGL loader, arcamera.js, itracker.js, ar-analytics.js, hunt-overlay.js |\n| WebGL template | itracker.js | **VENDOR** | Imagine WebAR - Image Tracker engine. Do not read, do not edit, do not document its internals here. Replaced wholesale on a plugin update. | Imagine WebAR licence |\n| WebGL template | arcamera.js | **VENDOR** | Imagine WebAR camera/canvas layer. Same rule as above. | Imagine WebAR licence |\n| WebGL template | opencv.js | **VENDOR** | OpenCV WASM build shipped with the plugin (~3.5 MB, the bulk of first load). Same rule as above; the watchdog in index.html exists because this can abort at runtime. | Imagine WebAR licence |\n| Backend | [hunt.php](../../ar-analytics/api/controllers/hunt.php) | API controller | The whole hunt engine and by far the largest file in the repo. Public actions: `register`, `resume`, `start`, `scan`, `status`, `config`, `leaderboard`, `activity`. Admin actions (Bearer token): participants, CSV exports, verify, add/remove player, reset, settings, and live toggles for registration, public displays and per-target open/closed. Phone number is the unique participant identity; every scan is timestamped server-side; each poster counts once. The timer runs from FIRST scan to LAST, not from page load. Completions under `HUNT_MIN_TOTAL_MS` (60s) or with gaps under `HUNT_MIN_GAP_MS` (10s) are flagged `is_suspect` and hidden from the public board until an admin verifies. Resume-by-code is throttled to 50 failures per IP per 5 minutes because the 5-digit space is only 90 000 wide and names are public. Creates and migrates its own tables on demand. | Database, Auth, Response helpers; poster ids owned by Unity |\n| Backend | [track.php](../../ar-analytics/api/controllers/track.php) | API controller | Public ingest for `ar-analytics.js`: `session`, `event`, `heartbeat`, POST-only. Authenticated by project API key (body or `X-API-Key`), never by user session - this is the endpoint the AR page itself calls. Derives IP and geo server-side. | Database, Auth::validateApiKey, Response |\n| Backend | [pixel.php](../../ar-analytics/api/controllers/pixel.php) | API controller | The same three ingest actions as track.php, but as a GET request carrying base64 JSON in `?d=`, always answering with a 1x1 transparent GIF. Exists because the shared host (InfinityFree) blocks or mangles cross-origin POSTs; the image-beacon trick sidesteps both CORS and that restriction. Appends every request to `debug.txt` beside itself - remember that file exists before pointing production traffic at it. | Database, Auth::validateApiKey |\n| Backend | [dashboard.php](../../ar-analytics/api/controllers/dashboard.php) | API controller | Read-only analytics for the client dashboard: overview, views-over-time, devices, browsers, locations, traffic, AR stats, sessions list, peak hours, languages, screen sizes, over a `range` of 24h/7d/30d/90d/365d. Enforces ownership at the top of the file - a `client` role can only ever reach its own projects, and falls back to its first project when none is named. | Database, Auth::requireAuth, Response |\n| Backend | [admin.php](../../ar-analytics/api/controllers/admin.php) | API controller | Admin-only CRUD for clients, projects and admin users, plus an overview. Requires role `admin` or `super_admin`. Runs three inline \"quick migrations\" (`admins.role`, `clients.password_plain`, `admins.password_plain`) on every request, wrapped in try/catch - cheap on MySQL, but it means schema drift is repaired by traffic rather than by a migration step. | Database, Auth::requireAuth, Response |\n| Backend | [auth.php](../../ar-analytics/api/controllers/auth.php) | API controller | Login for both audiences (`login` for clients, `admin-login` for staff), plus `me` and `change-password`. Issues the HMAC token every other controller verifies. | Auth helper, Database, Response |\n| Backend | [Auth.php](../../ar-analytics/api/helpers/Auth.php) | Helper | Token and credential handling: `generateApiKey` (32 random bytes, hex - the 64-char shape AnalyticsKeyPostBuild validates), `generateToken`/`verifyToken` (base64 payload + HMAC-SHA256, compared with `hash_equals`), bcrypt password hashing, `requireAuth` with role check, and `validateApiKey` which also refuses keys belonging to a deactivated client. Reads the Authorization header from three places because shared hosts strip it. | Database, `api/config.php` (APP_SECRET, TOKEN_LIFETIME) |\n| Backend | [Database.php](../../ar-analytics/api/helpers/Database.php) | Helper | Singleton PDO wrapper with `query` / `queryOne` / `execute` / `insert` / `scalar`. Prepared statements are real, not emulated (`ATTR_EMULATE_PREPARES => false`), which is what makes the parameterised calls throughout the controllers actually safe. A failed connection logs and exits 500 rather than throwing into a half-rendered response. | `api/config.php` (DB_*) |\n| Backend | [Response.php](../../ar-analytics/api/helpers/Response.php) | Helper | The single JSON envelope (`{success, message, data}`) every controller answers in - `success()` and `error()` both `exit`, so calling one ends the request. Also owns the permissive CORS headers (the AR page is on a different origin) and the no-cache headers. | None |\n| Player page | [index.html](../../ar-analytics/hunt/index.html) | Player page | The hunt landing page: registration form (name, phone, optional company/business type, consent), resume-by-code, and an \"in progress\" view. Derives its own API base from `location.pathname`, so it works at the domain root and in a subdirectory deploy. Pulls live branding, poster count and mode copy from `?action=config` before rendering. **`HUNT_AR_URL` at the top of its script block is empty and MUST be set to the deployed MemeHunt WebGL URL before an event** - the token is handed to the AR build as `?hunt_token=`, which is what makes it work cross-origin. | hunt.php (`config`, `register`, `resume`, `status`) |\n| Player page | [leaderboard.html](../../ar-analytics/hunt/leaderboard.html) | Player page | Public rankings plus a live activity ticker, both re-fetched every 5 seconds. Highlights the viewer's own row from their stored token, and honours the admin's leaderboard-off and feed-off switches by showing a closing message instead of stale data. Phone numbers never appear here - the server does not send them on this endpoint. | hunt.php (`leaderboard`, `activity`, `status`, `config`) |\n| Admin page | [admin.html](../../ar-analytics/hunt/admin.html) | Admin page | Single-file staff console for a live event: participant table with phone numbers, CSV exports (full and per-poster stall leads), verify/remove/add player, full reset, open/close individual targets mid-hunt, open/close registration, toggle the public displays, choose event mode (timed / untimed / points), paste the Unity poster-list JSON, edit white-label branding, and manage up to four sponsor ads. Logs in through `auth.php?action=admin-login` and sends a Bearer token on every call. **The poster-list box is the hand-off point from Unity:** leave it empty and the server stays on its built-in defaults, and every scan of a poster it has never heard of is rejected 400 while the video still plays - which looks like nothing at all going wrong. | hunt.php admin actions, auth.php |\n\n---\n\n## Adding a file\n\n1. Write the file.\n2. Add its row above, in its Area group.\n3. Make the Purpose column a sentence that says what it does **and the one thing\n   that is not obvious** - the constraint, the ordering, the failure it prevents.\n   \"Handles the video\" is not a purpose. If you cannot name a non-obvious thing,\n   say so plainly and keep the row short.\n4. Update the counts in the header block.\n"},{"id":"arrise-project-explained-hinglish-md","title":"Hinglish Guide","group":"ARRISE Platform","md":"# ARRISE WebAR Platform - Project Explained in Hinglish\n\n> **Job:** poore project ko easy Roman Hindi me samjhana - kaunsa hissa kya karta\n> hai, signal kahan se kahan jata hai, aur kaam kahan se shuru karein.\n> **Update when:** koi naya system add ho, ya koi flow badal jaye.\n> **Do NOT put here:** deep engineering detail. Wo [ARCHITECTURE.md](ARCHITECTURE.md)\n> aur [HUNT_ENGINE.md](HUNT_ENGINE.md) me rehta hai. Ye guide sirf samajh ke liye hai.\n\nYe practical onboarding guide hai. English docs se pehle ise padh lo - poora\nsystem 20 minute me samajh aa jayega, phir detail ke liye baaki docs kholo.\n\n## Live project snapshot\n\n- Unity version: **6000.3.9f1**\n- Custom Unity scripts: **8 runtime + 11 editor**\n- Campaign engine: `ar-analytics/api/controllers/hunt.php` (~1,766 lines)\n- Player overlay: `Assets/WebGLTemplates/iTracker/hunt-overlay.js` (~1,507 lines)\n- Detailed engineering source: [ARCHITECTURE.md](ARCHITECTURE.md)\n- Campaign engine source of truth: [HUNT_ENGINE.md](HUNT_ENGINE.md)\n- Event chalane wali guide: [OPERATIONS.md](OPERATIONS.md)\n\n---\n\n## 1. Project ko ek line me samjho\n\nEk printed poster ko phone camera se scan karo, uske upar AR content chalta hai,\naur us experience ke upar ek pura campaign (registration, scoring, clues, prizes)\nchalta hai - jo event ke beech me bhi phone se control ho sakta hai, **bina\nrebuild ke**.\n\n| System | Is project me responsibility |\n|---|---|\n| Unity + Imagine WebAR Image Tracker | Camera se poster pehchanna, uske upar 3D/video content dikhana |\n| WebGL template (`iTracker`) | Build ka HTML page - camera, tracker script, aur overlay ko load karta hai |\n| `hunt-overlay.js` | Player ko dikhne wali campaign UI - chips, timer, clue card, code prompt, victory card |\n| `hunt.php` (PHP + MySQL) | Saare rules: kaun register hua, kya scan hua, score, rank, admin controls |\n| `hunt/` HTML pages | Landing (register/resume), leaderboard (booth screen), admin (operator) |\n| jsDelivr CDN | Meme videos aur ad images serve karta hai (GitHub repo se) |\n\n```text\nPoster  = physical trigger\nUnity   = poster pehchano aur content chalao\nOverlay = game/campaign ka UI\nhunt.php= rules, score aur authority\nAdmin   = event ke time live control\n```\n\n---\n\n## 2. Zaroori words\n\n### Image target\nWo poster/image jise tracker pehchanta hai. Har target ki ek **id** hoti hai\n(jaise `Target1`). Ye id Unity build me bake ho jati hai - server aur build me ye\nid **bilkul same** honi chahiye, warna meme to chalega par scan count nahi hoga.\nYe sabse common silent bug hai.\n\n### Overlay\nBuild ke upar chalne wali JavaScript layer. Unity ko pata hi nahi ki koi hunt\nchal raha hai - overlay hi camera events sun kar server ko batata hai.\n\n### Settings (server-side)\n`hunt_settings` table ek key-value JSON store hai. Poster labels, hints, mode,\nbranding, ads, unlock codes - sab yahin rehta hai. Isi wajah se event ke beech\nme sab kuch phone se badla ja sakta hai.\n\n### Mode\nCampaign kis tarah rank karega:\n\n| Mode | Jeetne ka rule | Kab use karo |\n|---|---|---|\n| `timed` | Sabse tez total time | High energy, viral race (default) |\n| `untimed` | Jo pehle finish kare, bina clock ke | Relaxed expo, pressure nahi |\n| `points` | Har poster ke points ka total | Brand engagement events |\n\n### Unlock code\nKisi poster par optional 4-6 letter/number ka code laga sakte ho. Us poster ka\nscan tabhi count hota hai jab visitor **stall staff se code maang kar** enter\nkare. Isi se visitor ko brand se baat karni padti hai - warna log sirf scan karke\nbhaag jate hain.\n\n---\n\n## 3. Signal flow - poster se leaderboard tak\n\n```mermaid\nflowchart LR\n    P[\"Poster scan\"] --> U[\"Unity tracker\"]\n    U --> O[\"hunt-overlay.js\"]\n    O --> API[\"hunt.php ?action=scan\"]\n    API --> DB[(\"MySQL\")]\n    API --> O2[\"state wapas: count, next clue, offer\"]\n    O2 --> UI[\"Chips tick, clue card, victory card\"]\n    DB --> LB[\"leaderboard.html\"]\n```\n\nStep by step:\n\n1. Player poster par phone rakhta hai. Unity tracker target pehchanta hai.\n2. Overlay ka `onImageFound(id)` chalta hai.\n3. Agar poster par unlock code laga hai -> overlay code prompt dikhata hai.\n   Bina sahi code ke server kuch **record hi nahi karta**.\n4. Overlay `?action=scan` bhejta hai (token + poster_id + optional code).\n5. Server check karta hai: poster valid hai? open hai? sequential order sahi hai?\n   code sahi hai? Phir scan row likhta hai aur timer start karta hai.\n6. Server poora state wapas bhejta hai - count, total, next clue, score, offer.\n7. Overlay chips tick karta hai, clue card dikhata hai, aur agar sab poster ho\n   gaye to victory card banata hai.\n\n**Timer pehle scan par start hota hai**, register par nahi - taki app download\nkarne ka aur poster 1 tak chalne ka time count na ho.\n\n---\n\n## 4. Custom scripts - kis file ka kya kaam\n\n### Unity runtime (`Assets/Scripts/`)\n\n| Script | Kaam |\n|---|---|\n| `CampaignSettings.cs` | Scene khud batati hai ki wo hunt hai ya normal AR card. Build time par ye flag page me likha jata hai |\n| `CDNARVideoController.cs` | Target ka video CDN se stream karta hai (build size bachane ke liye) |\n| `ARContentScale.cs` | URL me `?scale=` se AR content ka size adjust karta hai |\n| `ShareManager.cs` | Victory card / content share karne ke liye |\n| `UIManager.cs` | Scene ki UI handling |\n| `RotateAndAutoReset.cs`, `SliderAnimationController.cs`, `ExampleUsage.cs` | Content ke chhote behaviours |\n\n### Unity editor tools (`Assets/Editor/`)\n\n| Script | Kaam |\n|---|---|\n| `MemeHuntSceneBuilder.cs` | Poster folder se poori Meme Hunt scene bana deta hai - poster daalo, rebuild karo, baaki automatic |\n| `RishabhSceneBuilder.cs` + `RishabhLayoutTools.cs` | AR visiting card scene aur uska layout round-trip tool |\n| `ARCardSetupWindow.cs` | Naya AR card setup karne ki window |\n| `HuntFlagPostBuild.cs` | Build ke baad page me `window.HUNT_CONFIG` likhta hai (hunt on/off) |\n| `AnalyticsKeyPostBuild.cs` | Build ke baad analytics project key likhta hai |\n| `BootSceneCampaign.cs` | Agar Unity ka scene callback na chale, to scene file **disk se** padh leta hai - ye safety net hai |\n| `PreBuildCheck.cs`, `PreBuildDialog.cs` | Build se pehle galtiyan pakadta hai |\n\n> **Yaad rakho:** `BootSceneCampaign.cs` isliye bana kyunki Unity ka\n> `[PostProcessScene]` callback hamesha nahi chalta. Ek baar wo skip ho gaya aur\n> build me registration screen hi nahi aayi - live event me. Ab callback na chale\n> to bhi sahi value milti hai, aur na mile to **red error** aata hai.\n\n### Backend (`ar-analytics/api/controllers/`)\n\n| File | Kaam |\n|---|---|\n| `hunt.php` | Poora campaign engine - registration, scan, score, rank, admin controls |\n| `track.php`, `pixel.php` | Analytics events |\n| `auth.php` | Admin login |\n| `dashboard.php`, `admin.php` | Analytics dashboard |\n\n---\n\n## 5. Admin panel - event ke time ke controls\n\nSab ek tap me, sabke liye turant live, aur sab **reversible**:\n\n| Control | Kya karta hai |\n|---|---|\n| **Registration Open/Closed** | Campaign khatam - naye log register nahi kar sakte, par jo khel rahe hain wo finish kar sakte hain |\n| **Leaderboard show/hide** | Hide karne par \"The Hunt Is Over - back soon\" card dikhta hai |\n| **Live Feed show/hide** | Booth screen ka ticker on/off |\n| **Targets Open/Close** | Koi poster kharab ho gaya? Use band kar do - baaki poster se hunt chalta rahega |\n| **Event Mode** | timed / untimed / points |\n| **Per-poster**: label, hint, unlock code, points, offer | Har poster ki setting alag |\n| **Stall Leads CSV** | Ek stall ke saare scanner ka lead list - yahi brand ko dena hai |\n| **Add Player** | Leaderboard par demo entry |\n\n### Target close karne ka rule (important)\n\n- Poster band karo -> wo sabke chips se **gayab** ho jata hai, counter `x/4` ho jata hai\n- Jo scan pehle ho chuke hain wo **delete nahi hote** - dobara open karo to credit wapas\n- Jis player ke paas baaki sab poster hain, wo **apne aap complete** ho jata hai, aur\n  uska finish time **aakhri scan** wala hi rehta hai (band karne ka time nahi)\n- **Aakhri bacha hua target band nahi ho sakta**\n\n---\n\n## 6. Kya cheez rebuild mangti hai, kya nahi\n\nYe table sabse zyada time bachata hai:\n\n| Change | Rebuild chahiye? |\n|---|---|\n| Poster label, hint, clue, mode, points, unlock code, branding, ads | **Nahi** - admin se turant |\n| Registration band, leaderboard hide, target close | **Nahi** - admin se turant |\n| PHP / admin / landing / leaderboard file | **Nahi** - sirf file upload |\n| `hunt-overlay.js` | **Nahi** - wo ek file replace karo + `?v=N` badhao |\n| Naya poster image, AR content, scene change | **Haan** - Unity rebuild |\n| CDN video badla | **Nahi**, par GitHub push karo (jsDelivr 12h tak purana serve kar sakta hai) |\n\n---\n\n## 7. Anti-cheat kaise kaam karta hai\n\nScan events phone se aate hain - server ke paas koi proof nahi ki camera ne\nsach me poster dekha. Isliye:\n\n- **Min total time floor** - itni tezi se poora hunt possible nahi (sirf `timed` mode me,\n  kyunki tezi tabhi shak ki baat hai jab speed se jeette hain)\n- **Min gap floor** - do scan ke beech itna kam time physically possible nahi.\n  Ye **har mode** me chalta hai, aur points mode me scan ke time par bhi -\n  kyunki points mode me bina complete kiye bhi rank milti hai\n- Pakde jane par `is_suspect` lag jata hai -> public leaderboard se hide\n- Admin **Verify** dabaye to wapas dikhne lagta hai\n\nPrize dene se pehle top 3 ko **saamne** ek poster dobara scan karwao. Yahi asli\ncontrol hai, software nahi.\n\n---\n\n## 8. Kaam kahan se shuru karein\n\n1. **[OPERATIONS.md](OPERATIONS.md)** padho - ek event ka poora flow samajh aayega.\n2. Admin panel kholo aur har control ko test data par chala kar dekho.\n3. **[HUNT_ENGINE.md](HUNT_ENGINE.md)** me apni feature wali section padho.\n4. Code chhune se pehle **[Engineering/WEBAR-TRAPS.md](../Engineering/WEBAR-TRAPS.md)**\n   padh lo - wahan wo galtiyan likhi hain jo hum production me bhugat chuke hain.\n5. Koi bhi change ke baad: server change = upload, overlay change = file + `?v=N`,\n   Unity change = rebuild.\n\n> **Ek baat honestly:** ye platform brand ko **footfall, dwell time aur lead\n> list** de sakta hai - **sale nahi**. Stall owner ko yahi promise karo jo deliver\n> ho sakta hai, aur engagement ke liye unlock code + offer wala setup use karo.\n> Detail [OPERATIONS.md](OPERATIONS.md) ke \"Selling to brands\" section me hai.\n"},{"id":"engineering-readme-md","title":"Handbook Overview","group":"Dev Guide","md":"# WebAR Engineering Handbook\n\n> **Job:** teach a developer how to build WebAR on this stack - Unity WebGL, a\n> commercial image-tracking plugin, a JavaScript overlay, and a PHP backend.\n> What to do, what not to do, and why.\n> **Update when:** an incident or a code review turns up a rule that is not\n> written down here, or a rule here turns out to be wrong.\n> **Do NOT put here:** anything specific to one campaign or client. Project\n> architecture and features belong in that project's own documentation folder.\n\n**This folder is portable.** It names no client and no campaign. Copy it into any\nUnity WebGL + web-backend project and it works - there is no tooling to port,\nonly Markdown. Examples marked *\"Seen in the field\"* come from a real event\nplatform; they are illustrations, and every rule stands without them.\n\n---\n\n## I am about to... -> read this\n\nDo not read this folder front to back. Find what you are about to do.\n\n| I am about to... | Read |\n|---|---|\n| Work on this stack for the first time | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) - all of it, once |\n| Trust a Unity build-time callback to inject something | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) § Build-time callbacks |\n| Position, scale or parent anything on an image target | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) § The plugin owns your transform |\n| Add video or audio to a target | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) § Streaming and page load |\n| Lay out a HUD row, chip list or name column | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) § Layout and measurement |\n| Measure an element to fit text | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) § Layout and measurement |\n| Ship an asset through a CDN | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) § Caching |\n| Trust anything a phone tells the server | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) § Client-asserted data |\n| Write an error message for a failed lookup | [WEBAR-TRAPS.md](WEBAR-TRAPS.md) § Client-asserted data |\n\n---\n\n## How rules are written\n\nEvery rule has the same shape, so you can scan it:\n\n> ### The rule, as an instruction\n> `breaks things` · `junior trap`\n>\n> **Why** - the mechanism. What actually happens at runtime. A rule without a\n> mechanism gets cargo-culted or ignored; neither is learning.\n>\n> Wrong code, then right code.\n>\n> **Spot it** - how a reviewer or a tool finds this.\n\nSeverity means:\n\n- `breaks things` - causes a real defect. Not negotiable.\n- `costly` - works, but wastes performance, money or time. Fix when you touch the file.\n- `style` - consistency only. Follow it, do not argue about it.\n\n`junior trap` marks the ones that are genuinely counter-intuitive. Nobody is\nstupid for hitting them; they are traps because the code looks correct.\n\n---\n\n## The four ideas behind all of it\n\nIf you remember nothing else:\n\n**1. Silence is the enemy - and a silent default is worse than a crash.** The\nworst defects on this stack throw nothing and print nothing. A build-time\ncallback that did not run, a plugin that overwrote your transform, a flex child\nthat clipped a name, a scan that was never counted. Every one of them looked\nfine. So: prefer designs that fail *loudly*, and never let a step that did not\nhappen fall back to a plausible-looking value.\n\n*Seen in the field: a skipped Unity callback defaulted the campaign flag to\n\"off\". The build looked perfect and shipped to a live event with no registration\nscreen at all. Nothing errored. It stayed broken across every later build.*\n\n**2. You do not own what a vendor package touches every frame.** A tracking\nplugin that writes your transform each frame will silently undo your scale, your\nposition, and your careful work. Find what the package writes, and put your own\nvalues somewhere it does not reach.\n\n**3. The server owns the rules; the build owns the experience.** Anything you\nmight want to change during a live event - text, scoring, availability, branding\n- must be data the server sends, not something compiled into a build. A rebuild\nduring an event is a failure of design, not a task.\n\n**4. Treat every phone as an unreliable narrator.** Client-asserted events can be\nforged, replayed, delayed by hours on venue wifi, or arrive from a browser you\nnever tested. Validate on the server, make the offline path explicit, and assume\nanything visible to the player is visible to an attacker.\n\n---\n\n## Local conventions\n\nAnything a specific project adds to these rules lives in that project's own docs,\nnot here. If a project's rule contradicts a rule in this folder, the project's\nrule wins **and should say why** - that is a real trade-off worth writing down,\nnot an exception to hide.\n"},{"id":"engineering-webar-traps-md","title":"WebAR Traps","group":"Dev Guide","md":"# WebAR Traps\n\n> **Job:** the behaviours of this stack - Unity WebGL, a commercial image-tracking\n> plugin, a JavaScript overlay and a PHP backend - that make correct-looking code\n> behave wrongly. Build callbacks, vendor transforms, browser layout, CDNs, and\n> data a phone asserts about itself.\n> **Update when:** a defect is traced to a mechanism not described here, or a rule\n> here turns out to be wrong.\n> **Do NOT put here:** anything about one campaign, client or event. That belongs\n> in the project's own documentation folder. How to read this folder is in\n> [README.md](README.md).\n\nEvery rule below cost a production incident. Almost none of them threw an\nexception. The build succeeded, the page loaded, the camera opened - and the\nthing was broken in a way only a visitor could see.\n\n---\n\n## Build-time callbacks\n\n### Never let a callback that did not run fall back to a plausible default.\n`breaks things` · `junior trap`\n\n**Why** - `[PostProcessScene]` runs once per scene *while that scene is loaded*\nduring a player build. Unity **skips scene processing when an incremental build\nreuses cached scene data**. The callback does not fire, the static it fills stays\n`null`, and the post-build step reading it takes its default branch. If that\ndefault is a legal-looking value you have shipped a wrong build with a green\nconsole. It also **does not self-correct** - once the scene stops being\nreprocessed, every later build repeats the same wrong answer, so rebuilding is\nnot a fix.\n\n```mermaid\nflowchart LR\n    Build[\"Unity build\"] --> Cached{\"Scene data cached?\"}\n    Cached -- \"no\" --> Callback[\"PostProcessScene runs\"] --> Flag[\"flag = scene value\"]\n    Cached -- \"yes\" --> Skip[\"callback SKIPPED\"] --> Null[\"flag = null\"]\n    Null --> Default[\"?? false : silent wrong build\"]\n    Null --> Disk[\"read the scene FILE : correct, or a loud error\"]\n```\n\n```csharp\n// WRONG - \"did not run\" and \"declared off\" are the same value\nbool isHunt = bootSceneIsHunt ?? false;   // the whole incident lives on this line\nWriteFlag(buildPath, isHunt);\n```\n\n```csharp\n// RIGHT - separate \"what it says\" from \"did anyone say anything\",\n// then read the source of truth, and fail LOUDLY if you cannot.\nbool isHunt   = bootSceneIsHunt ?? false;\nbool declared = bootSceneIsHunt.HasValue;\n\nif (!declared)\n{\n    // Unity builds the player from the scene FILES, so parsing the file is\n    // reading exactly what was built. A file read cannot \"not happen\".\n    var disk = BootSceneCampaign.ReadFromDisk();\n    if (!string.IsNullOrEmpty(disk.Error))\n        Debug.LogError(\"[HuntFlag] Cannot tell whether this is a hunt build. \" + disk.Error);\n    else if (disk.Found) { isHunt = disk.HuntEnabled; declared = true; }\n}\n\nWriteFlag(buildPath, isHunt);\n// Always state the decision AND its provenance: \"flag = false\" proves nothing,\n// because false is often correct. The diagnostic value is in \"read from\".\nDebug.Log(\"[HuntFlag] hunt=\" + isHunt + \"  scene=\" + scenePath + \"  read from=\" + source);\nif (!declared)\n    Debug.LogError(\"[HuntFlag] No campaign settings readable - hunt switched OFF by default.\");\n```\n\n*Seen in the field:* on ARRISE, `HuntFlagPostBuild` learned \"is this the Meme\nHunt?\" from `[PostProcessScene]`. Incremental builds stopped reprocessing the\nscene, the flag defaulted to `enabled: false`, and six consecutive builds shipped\nto a live event with no registration, no chips, no timer and no scoring - a\nhealthy-looking AR page with the whole game missing. The Editor log said\n`scene: \u003cunknown>` every time, as a *warning*, which scrolled past. The fix is\n`Assets/Editor/BootSceneCampaign.cs`: parse the boot scene's `.unity` file.\n\n**Spot it:** grep build-time code for `??`, `GetValueOrDefault`, and\n`if (x == null) x = \u003csomething reasonable>`. For every static a build callback\nfills, ask: *what does the next step do when this callback never runs?*\n\n---\n\n## The plugin owns your transform\n\n### Put your own scale on a child, never on the tracked target root.\n`breaks things` · `junior trap`\n\n**Why** - the tracker writes the target's transform from tracking data on every\ntracked frame. In `ImageTracker.ParseData` (called from the JS `OnTrack` message)\nthe root is hard-assigned, not blended:\n\n| Property | Written every tracked frame | By |\n|---|---|---|\n| `position` | yes | `target.position = newPos` |\n| `rotation` | yes | `target.rotation = newRot` |\n| `localScale` | yes | `Vector3.one`, or `(-1,1,1)` when the camera is flipped |\n\nA scale set on the root in the Inspector, in `Start`, or by a tween therefore\nsurvives exactly until the first frame the poster is seen - which is the only\nmoment anyone is looking. It reads as \"my scale is ignored\", never as \"something\noverwrites it\".\n\n```csharp\n// WRONG - gone on the first tracked frame\ntargetRoot.transform.localScale = Vector3.one * 0.6f;\n```\n\n```csharp\n// RIGHT - one child owns the scale; the plugin never reaches it\nvar content = new GameObject(\"Content\");\ncontent.transform.SetParent(targetRoot.transform, false);\ncontent.transform.localScale = Vector3.one * ContentScale;   // all visible content parents here\n```\n\n```mermaid\nflowchart LR\n    Tracker[\"ImageTracker\"] --> Root[\"Target root : pos, rot, scale owned by the plugin\"]\n    Root --> Content[\"Content : scale owned by you\"]\n    Content --> Video[\"Video plane\"]\n    Content --> Canvas[\"World canvas\"]\n```\n\n*Seen in the field:* ARRISE puts `ARContentScale` on that child, so the number\ncan be retuned live with `?scale=0.55` in the page URL instead of costing a Unity\nrebuild plus an upload per guess.\n\n**Spot it:** any `localScale`, `position` or `rotation` write on an object the\ntracker lists as a target. Read the vendor's per-frame method once and write down\nwhat it assigns.\n\n### Treat every vendor `GetComponent` as unguarded, and give the package what its code assumes.\n`breaks things`\n\n**Why** - vendor code is written against the vendor's demo scene:\n\n```csharp\n// vendor code - ImageTracker.Start(), an IEnumerator\nforeach (var i in imageTargets)\n{\n    targets.Add(i.id, i);\n    i.transform.GetComponent\u003cRenderer>().enabled = false;   // no null check\n    i.transform.gameObject.SetActive(false);\n}\nStartWebGLiTracker(serializedIds, name);                    // never reached\n```\n\nA target with a `MeshFilter` and no `MeshRenderer` throws a\n`NullReferenceException` on that line. It happens inside `Start`, so the\ncoroutine aborts: the remaining targets are never registered and\n`StartWebGLiTracker` is never called. **One missing component on one target kills\ntracking for the whole page** - camera feed, loader and UI all normal, nothing\never tracks.\n\n```csharp\n// RIGHT - the renderer is mandatory even though the poster art is never drawn\ntargetObj.AddComponent\u003cMeshFilter>().sharedMesh = GetOrCreateMesh(w, h, id + \"_TrackImg\");\n// ImageTracker.Start() does GetComponent\u003cRenderer>().enabled = false with no null check.\ntargetObj.AddComponent\u003cMeshRenderer>().sharedMaterial = mat;\n```\n\n**Spot it:** every target root built by hand. Generate targets from one builder\nso the required components cannot be forgotten, and add a pre-build check for\n\"target with no Renderer\".\n\n---\n\n## Streaming and page load\n\n### Anything that starts a download in `Awake` must ship INACTIVE.\n`breaks things` · `costly` · `junior trap`\n\n**Why** - the order is the trap. Unity runs `Awake` and `OnEnable` on **every\nactive object**, then `Start`. A tracker deactivates its target roots in `Start`\n- which is *after* all those `Awake`s have already run. So a target authored\nactive means:\n\n1. `CDNARVideoController.Awake` runs, builds its persistent `VideoPlayer` and\n   calls `Prepare()` - the CDN fetch starts immediately.\n2. `OnEnable` runs and calls `Play()` - audio starts.\n3. Only then does `ImageTracker.Start` set the root inactive.\n\nOn a five-poster hunt that is five video streams downloading, and five audio\ntracks playing, over venue wifi before the visitor has scanned anything.\nDeactivating in `Start` does not recall the bytes already in flight.\n\n```csharp\n// RIGHT - template convention, enforced by the scene builders.\n// Target roots start INACTIVE; the tracker re-activates on tracking-found.\n// BEHAVIOURAL, not cosmetic: an active root means every clip downloads and\n// every meme's audio plays at page load, before anything is scanned.\ntargetObj.SetActive(false);\n```\n\n**Spot it:** grep `Awake` and `OnEnable` for `Prepare(`, `Play(`,\n`UnityWebRequest`, `StartCoroutine(Download`. Every hit belongs on an object that\nships inactive, or the work belongs behind an explicit \"activate me\" call.\n\n---\n\n## Layout and measurement\n\n### Clear `min-width` on any flex child that holds text.\n`breaks things` · `junior trap`\n\n**Why** - a flex item's default `min-width` is `auto`, which resolves to its\n**min-content** size. The item refuses to shrink below its longest unbreakable\nword, whatever `flex` says. It pushes past the container, the container (or an\nancestor with `overflow:hidden`) clips it, and the text is simply cut - no\nscrollbar, no console warning. `overflow-wrap:anywhere` alone does nothing: the\nitem never gets narrow enough to need wrapping.\n\n```css\n/* WRONG - a long name is silently CUT OFF */\n.fitem { display:flex; justify-content:space-between; gap:10px; }\n.fitem > span:first-child { overflow-wrap:anywhere; }\n```\n\n```css\n/* RIGHT - allow the shrink, then allow the wrap */\n.fitem > span:first-child { min-width:0; overflow-wrap:anywhere; }\n```\n\n*Seen in the field:* on the ARRISE leaderboard this clipped participant names in\n**two** places for the same reason - the live feed rows (`.fitem`, inside a\n`#feedWrap` with `overflow:hidden`) and the \"Your Rank\" card (`.you-card`). The\nHUD hint row in `hunt-overlay.js` needs the same `flex:1; min-width:0`.\n\n**Spot it:** every `display:flex` whose children contain user-supplied text. A\nchild without `min-width:0` cannot shrink.\n\n### Measure after you show it - a hidden element measures 0.\n`breaks things` · `junior trap`\n\n**Why** - `display:none` generates no box, so every size read is `0`. A\nfit-to-width loop is written as `while (content > container)`, and `0 > 0` is\nfalse: it exits immediately having done nothing, and the element then appears at\nfull size. It even *looks* like the routine works, because the next `resize` or\n`orientationchange` re-runs it against a visible element - so the bug reproduces\nonly on first load.\n\n| Read on a `display:none` element | Returns |\n|---|---|\n| `offsetWidth` / `offsetHeight` | `0` |\n| `clientWidth` / `scrollWidth` | `0` |\n| `getBoundingClientRect()` | all-zero rect |\n| `getComputedStyle().fontSize` | real value - styles still resolve |\n\n```js\n// WRONG - render() runs from the boot path, before the row is shown\nfunction renderChips() { chipsEl.innerHTML = html; fitChips(); }\napplyState(res.data, false);      // -> renderChips() -> fitChips() on a display:none row\nchipsEl.style.display = 'flex';   // too late\n```\n\n```js\n// RIGHT - show first, then fit, and re-fit whenever the box can change\nchipsEl.style.display = 'flex';\napplyState(res.data, false);\nwindow.addEventListener('resize', fitChips);\nwindow.addEventListener('orientationchange', function () { setTimeout(fitChips, 250); });\n```\n\n**Spot it:** any fit/measure function called from a render function. Follow the\ncall chain to where the element is actually shown and check which happens first.\n\n### Measure a centred row by summing its children, not with `scrollWidth`.\n`breaks things`\n\n**Why** - the scrollable overflow region is **clamped at the start edge** of the\npadding box, so content pushed off the left (in LTR) is unreachable and is not\ncounted. `justify-content:center` splits the overflow evenly across both sides,\nso `scrollWidth` only ever sees the right-hand half and under-reports the row's\ntrue width by about half the excess. As a boolean \"does it overflow\" that is\ntolerable; as a *size* it is wrong, and so is every decision derived from it -\nhow far to shrink, when to ellipsise, whether to change layout. The symptom is\nitems bleeding off **both** edges with nothing to scroll. On a `\u003ccanvas>` there\nis no layout engine at all, so summing is the only option there in any case.\n\n```js\n// WRONG - a centred row's real width is not scrollWidth\nwhile (row.scrollWidth > row.clientWidth && fs > MIN) { fs -= 0.25; setFs(fs); }\n```\n\n```js\n// RIGHT - sum the children plus the gaps; that is the row's real width\nfunction rowWidth(row) {\n  var kids = row.children, w = 0;\n  var gap = parseFloat(getComputedStyle(row).columnGap) || 0;\n  for (var i = 0; i \u003c kids.length; i++) { w += kids[i].getBoundingClientRect().width; }\n  return w + gap * Math.max(0, kids.length - 1);\n}\nwhile (rowWidth(row) > row.clientWidth && fs > MIN) { fs -= 0.25; setFs(fs); }\n```\n\n*Seen in the field:* the ARRISE victory card drew its poster chips on a canvas at\na fixed 26px. Five real labels measured 1231px on a 1080px card, and centring\nthat bled chips off both edges of the image every player shares. The fix sums\n`ctx.measureText` widths plus padding and gaps, then shrinks until the total fits\n`W - 80`: 956px at 20px.\n\n**Spot it:** `scrollWidth` used as a width rather than a yes/no, on any element\nwhose computed `justify-content` is `center`. Also any fixed font size on text an\nadmin can edit at runtime.\n\n---\n\n## Caching\n\n### Pin third-party URLs to an immutable version; version-stamp your own files monotonically.\n`breaks things` · `costly`\n\n**Why** - CDNs cache by URL, and for how long depends on whether the URL names\nsomething immutable. jsDelivr serves a *mutable* ref such as `@main` from the\nedge for up to **12 hours**; an exact version such as `@4.4.0` is cached\neffectively forever. So a `@main` URL means you push the fix, refresh your own\nphone, see it work - and half the venue runs yesterday's file for the rest of the\nday. You cannot tell which file a given phone holds, which makes every bug report\nduring an event unfalsifiable. Your own files next to `index.html` have the same\nproblem via the browser and any proxy between; the query string is what defines\n\"a different file\".\n\n| URL | Mutable? | Cached | Use for |\n|---|---|---|---|\n| `cdn.jsdelivr.net/npm/chart.js@4.4.0/...` | no | permanently | third-party libraries |\n| `cdn.jsdelivr.net/gh/\u003cuser>/\u003crepo>@main/x.mp4` | yes | up to 12h | content you will never hot-fix |\n| `hunt-overlay.js` | yes | browser/proxy default | never |\n| `hunt-overlay.js?v=26` | no, by convention | keyed to `v` | your own hot-fixable files |\n\nTwo habits make the query string trustworthy. **Bump it in the same commit as the\ncontent** - a file changed without a bump is a file some phones will never fetch.\nAnd **never reuse a number for different content**: `?v=17` must mean one exact\nfile forever, so go monotonic and never roll the number back, even to undo a\nchange. A revert is `v+1`, not `v-1`.\n\n```html\n\u003c!-- WRONG - mutable third-party ref, and no version on our own file -->\n\u003cscript src=\"https://cdn.jsdelivr.net/gh/acme/assets@main/vendor-lib.js\">\u003c/script>\n\u003cscript src=\"hunt-overlay.js\">\u003c/script>\n```\n\n```html\n\u003c!-- RIGHT -->\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js\">\u003c/script>\n\u003cscript src=\"hunt-overlay.js?v=26\">\u003c/script>\n```\n\n*Seen in the field:* ARRISE keeps the overlay in four copies (two WebGL templates\nplus two build folders), so the deploy step is \"edit, sync all copies, bump\n`?v=N` in every `index.html`, upload\". Skipping the bump is the same incident\nevery time: the fix is on the server and nobody's phone has it.\n\n**Spot it:** grep for `@main`, `@master`, `@latest` in any URL you might need to\nfix during an event. Then diff the last deploy: did a versioned file change\nwithout its `?v` moving?\n\n---\n\n## Client-asserted data\n\n### Put a plausibility floor on the server - and make the floor match the ranking rule.\n`breaks things`\n\n**Why** - a scan is a `POST`. Nothing in it proves a camera saw a poster; anyone\nwith the network tab open can send five in a second. The defence is a server-side\nfloor on what is physically possible, checked where the server owns the clock.\n\nThe trap is the second half: a floor only defends **where the thing it measures\ndecides the ranking**, and only on **a code path the cheat reaches**. A\ntotal-time floor (\"nobody finishes five posters in under 60s\") means nothing in a\npoints or untimed mode - there is no total time, and speed is not what wins.\nWorse, a floor that runs only at *completion* never runs at all in a mode where\nplayers are ranked before they complete: that whole mode is unprotected while the\ncode reads as though it is covered. Use an invariant that holds in every mode -\nthe minimum gap between two consecutive counted scans - and apply the\nmode-specific floor only inside its mode.\n\n```php\n// WRONG - one floor, one field, one mode, and only at completion\nfunction flagIfImplausible($db, $id) {\n    $row = $db->queryOne(\"SELECT total_ms FROM hunt_participants WHERE id = ?\", [$id]);\n    if (intval($row['total_ms']) \u003c HUNT_MIN_TOTAL_MS) { flag($db, $id); }\n}\n```\n\n```php\n// RIGHT - mode-specific floor guarded by the mode; universal floor always\nfunction flagIfImplausible($db, $participantId) {          // at completion\n    $row = $db->queryOne(\"SELECT total_ms FROM hunt_participants WHERE id = ?\", [$participantId]);\n    if (!$row || $row['total_ms'] === null) return;\n    $floors  = huntFloors();                               // dashboard-tunable, not constants\n    $suspect = (huntMode() === 'timed') && intval($row['total_ms']) \u003c $floors['total'];\n    if (!$suspect) { $suspect = hasGapViolation($db, $participantId); }\n    if ($suspect) { $db->execute(\"UPDATE hunt_participants SET is_suspect = TRUE WHERE id = ?\", [$participantId]); }\n}\n\nfunction flagGapOnly($db, $participantId) {                // at SCAN time\n    // Points/untimed players are ranked publicly without ever reaching the\n    // completion path, so the universal floor has to run here too.\n    if (hasGapViolation($db, $participantId)) {\n        $db->execute(\"UPDATE hunt_participants SET is_suspect = TRUE WHERE id = ?\", [$participantId]);\n    }\n}\n```\n\nFlag, do not delete. A flagged run drops off the public board and stays visible to\nstaff, so a genuinely fast player can be verified in person and put back. A floor\nwith no human override turns your best participant into a support ticket.\n\n**Spot it:** any validation reading a column only some modes populate (`total_ms`,\n`completed_at`). Any check that runs only on the completion path, in a mode where\nnobody has to complete. Floors belong in settings - the right value is measured by\nwalking the real route on the day.\n\n### Return one generic failure message for a lookup, and throttle it.\n`breaks things`\n\n**Why** - a lookup that answers \"no such code\" differently from \"wrong name\" is\nan **enumeration oracle**: sweep the code space with any name, keep everything\nthat comes back \"wrong name\", and you hold a list of live sessions. Combine that\nwith public data - a leaderboard prints the names - and one request per candidate\nhijacks a named winner's session.\n\nThe wording is only half of it. Status code, response time and response length\nleak the same distinction, so the two branches must be *literally the same\nresponse*. And a five-digit code is a 90,000-key space: at one request per second\nan unthrottled sweep finishes within a day. Throttle failed attempts per client,\nkeyed on `REMOTE_ADDR` - the TCP peer - never on a forwarded header the client\ncontrols.\n\n```php\n// WRONG - two branches, two messages, two status codes = an oracle\nif (!$existing) Response::error('No player with that code', 404);\nif ($existing['name'] !== $name) Response::error('That name does not match this code', 409);\n```\n\n```php\n// RIGHT - one branch, one message, one status, plus a per-IP budget\nresumeThrottleGuard($db, $ip);                       // 429 once the budget is spent\n$existing = preg_match('/^[0-9]{5}$/', $code)\n    ? $db->queryOne(\"SELECT * FROM hunt_participants WHERE player_code = ?\", [$code])\n    : null;\nif (!$existing || mb_strtolower(trim($existing['name']), 'UTF-8') !== mb_strtolower($name, 'UTF-8')) {\n    resumeThrottleFail($db, $ip);\n    Response::error('No match - check the name and 5-digit code you registered with.', 404);\n}\nresumeThrottleReset($db, $ip);                       // a real user never accumulates a budget\n```\n\nSize the budget against the venue, not the attacker: everyone behind one NAT\nshares an IP, so 50 failures per 5 minutes lets a whole hall fumble freely while\na 90,000-code sweep takes days. Keep the throttle best-effort - a missing table or\na DB hiccup must never block a legitimate resume.\n\n**Spot it:** two `error(...)` calls with different text in one lookup path. A\nlookup keyed on a short numeric code with no per-client failure counter. Any\nidentifier that is both short and printed in public.\n\n---\n\n## How to add a rule here\n\nA rule earns its place when it has cost something real and is not obvious from\nthe code.\n\n1. **Heading = instruction.** \"Clear `min-width` on flex children\", not \"About\n   flex sizing\"; a reader must be able to obey the heading alone. Tag the\n   severity under it, plus `junior trap` when the code genuinely looks correct.\n2. **State the mechanism in `Why`.** Which callback, which frame, which spec\n   behaviour. A rule without a mechanism gets cargo-culted or ignored; neither is\n   learning. If you cannot state it, you have not finished debugging.\n3. **Wrong code, then right code.** Real code from the real fix, trimmed.\n4. **Finish with `Spot it`.** The grep, the review question, or the check a tool\n   could run. A rule nobody can find violations of is decoration.\n5. **Keep it portable.** No client, campaign or event names in the rule itself -\n   those go in a *\"Seen in the field\"* aside, and the rule must still stand with\n   the aside deleted. Then add a row to the \"I am about to...\" table in\n   [README.md](README.md), or nobody arrives here in time.\n"}];

/* ---------- Minimal, dependency-free Markdown renderer ----------
   Supports what our docs actually use: headings, tables, fenced code,
   blockquotes, lists, links, bold/italic/inline code, hr. Mermaid flowcharts
   are turned into readable node/arrow rows rather than left as raw source. */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,t,h)=>{
    if(/^https?:/.test(h)) return '<a href="'+h+'" target="_blank" rel="noopener">'+t+'</a>';
    const hit = PAGES.find(p=>h.toLowerCase().includes(p.id.split('-').slice(-2,-1)[0]||'@@'));
    const md = h.split('#')[0].split('/').pop();
    const target = PAGES.find(p=>p.id.endsWith(md.replace(/\./g,'-').toLowerCase()));
    return target ? '<a href="#'+target.id+'" data-nav="'+target.id+'">'+t+'</a>'
                  : '<a href="'+h+'">'+t+'</a>';
  });
  // severity chips
  s = s.replace(/<code>breaks things<\/code>/g,'<span class="sev sev-breaks">breaks things</span>');
  s = s.replace(/<code>costly<\/code>/g,'<span class="sev sev-costly">costly</span>');
  s = s.replace(/<code>style<\/code>/g,'<span class="sev sev-style">style</span>');
  s = s.replace(/<code>junior trap<\/code>/g,'<span class="sev sev-trap">junior trap</span>');
  return s;
}

/* Turn a mermaid flowchart into readable rows of nodes and arrows. */
function flow(src){
  const label = {};
  const rows = [];
  src.split('\n').forEach(raw=>{
    const line = raw.trim();
    if(!line || /^(flowchart|graph|subgraph|end|direction)/.test(line)) return;
    // capture id["Label"] definitions anywhere on the line
    line.replace(/([A-Za-z0-9_]+)\[(?:"|)([^\]"]+)(?:"|)\]/g,(m,id,txt)=>{label[id]=txt.replace(/<br\/?>/g,' ');return m;});
    line.replace(/([A-Za-z0-9_]+)\((?:"|)([^)"]+)(?:"|)\)/g,(m,id,txt)=>{label[id]=txt.replace(/<br\/?>/g,' ');return m;});
    if(line.includes('--')){
      const parts = line.split(/\s*-->\s*|\s*---\s*/);
      const edge = (line.match(/--\s*"?([^">|]+)"?\s*-->/)||line.match(/\|([^|]+)\|/)||[])[1];
      rows.push({parts:parts.map(p=>{
        const id=(p.match(/^([A-Za-z0-9_]+)/)||[])[1]||p.trim();
        return label[id]||id;
      }), edge:edge?edge.trim():''});
    }
  });
  if(!rows.length) return '<pre><code>'+esc(src)+'</code></pre>';
  return '<div class="flow"><div class="flow-t">Flow</div>'+rows.map(r=>
    '<div class="flow-row">'+r.parts.map(p=>'<span class="node">'+esc(p)+'</span>')
      .join('<span class="arrow">-&gt;'+(r.edge?' <small>'+esc(r.edge)+'</small>':'')+'</span>')+'</div>'
  ).join('')+'</div>';
}

function render(md){
  const out=[]; const lines=md.split('\n'); let i=0;
  while(i<lines.length){
    const L=lines[i];
    // fenced code
    if(/^```/.test(L)){
      const lang=L.slice(3).trim(); const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(lang==='mermaid' ? flow(buf.join('\n'))
        : '<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    // table
    if(/^\|/.test(L) && /^\|[\s:|-]+\|$/.test(lines[i+1]||'')){
      const head=L.split('|').slice(1,-1).map(c=>c.trim()); i+=2;
      const body=[];
      while(i<lines.length && /^\|/.test(lines[i])) body.push(lines[i++].split('|').slice(1,-1).map(c=>c.trim()));
      out.push('<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    // blockquote
    if(/^>/.test(L)){
      const buf=[];
      while(i<lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,''));
      out.push('<blockquote>'+render(buf.join('\n'))+'</blockquote>');
      continue;
    }
    // heading
    const h=L.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n=h[1].length; const id=h[2].toLowerCase().replace(/[^a-z0-9]+/g,'-');
      out.push('<h'+n+' id="'+id+'">'+inline(h[2])+'</h'+n+'>'); i++; continue; }
    // hr
    if(/^---+$/.test(L)){ out.push('<hr>'); i++; continue; }
    // lists
    if(/^\s*([-*]|\d+\.)\s+/.test(L)){
      const ordered=/^\s*\d+\./.test(L); const buf=[];
      while(i<lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])){
        buf.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,'')); i++;
        while(i<lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])){
          buf[buf.length-1]+=' '+lines[i].trim(); i++;
        }
      }
      out.push('<'+(ordered?'ol':'ul')+'>'+buf.map(b=>'<li>'+inline(b)+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>');
      continue;
    }
    if(!L.trim()){ i++; continue; }
    // paragraph
    const buf=[];
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|\||>|```|---+$|\s*([-*]|\d+\.)\s)/.test(lines[i])) buf.push(lines[i++]);
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('\n');
}

/* ---------- Build the page ---------- */
const main=document.getElementById('main'), navEl=document.getElementById('nav');
const groups=[...new Set(PAGES.map(p=>p.group))];
navEl.innerHTML=groups.map(g=>'<div class="grp">'+g+'</div>'+
  PAGES.filter(p=>p.group===g).map(p=>'<a href="#'+p.id+'" data-nav="'+p.id+'">'+p.title+'</a>').join('')
).join('');
main.innerHTML=PAGES.map(p=>'<article class="page" id="'+p.id+'">'+render(p.md)+'</article>').join('');

function show(id){
  const t=PAGES.find(p=>p.id===id)||PAGES[0];
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id===t.id));
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===t.id));
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-nav]');
  if(a){ e.preventDefault(); location.hash=a.dataset.nav; show(a.dataset.nav); }
});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||PAGES[0].id);

/* ---------- Search ---------- */
const q=document.getElementById('q'), hits=document.getElementById('hits');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(v.length<2){hits.innerHTML='';return;}
  const found=[];
  PAGES.forEach(p=>{
    p.md.split('\n').forEach(line=>{
      if(found.length<25 && line.toLowerCase().includes(v) && line.trim().length>3){
        found.push({id:p.id,title:p.title,line:line.replace(/^#+\s*/,'').replace(/[|*`>]/g,'').trim().slice(0,95)});
      }
    });
  });
  hits.innerHTML = found.length
    ? found.map(f=>'<a class="hit" href="#'+f.id+'" data-nav="'+f.id+'"><b>'+f.title+'</b>'+esc(f.line)+'</a>').join('')
    : '<div class="empty">No matches.</div>';
});
</script>
